# PROTOTYPE gateway env (used as --env-file for ar-io-node/docker-compose.yaml)
# (named *.conf because this workspace denies writing *.env files)
# Deltas from upstream defaults are commented inline.

# Admin key: needed by the bundler's fulfillment service to optical-bridge
# data items into the gateway (AR_IO_ADMIN_KEY defaults to $ADMIN_API_KEY).
ADMIN_API_KEY=proto-admin-key

# --- Cut mainnet: point the "trusted Arweave node" at local ArLocal ---------
# core (default: http://envoy:3000 -> envoy proxies to arweave.net)
TRUSTED_NODE_URL=http://arlocal:1984
# envoy (defaults: arweave.net:443 / peers.arweave.xyz:1984)
TRUSTED_NODE_HOST=arlocal
TRUSTED_NODE_PORT=1984
FALLBACK_NODE_HOST=arlocal
FALLBACK_NODE_PORT=1984
ENABLE_ARWEAVE_PEER_EDS=false
ARWEAVE_PEER_DNS_RECORDS=arlocal

# Never broadcast tx/chunks to Arweave (bundle settlement becomes a no-op 200)
ARWEAVE_POST_DRY_RUN=true

# --- Bundler integration (values prescribed by .env.bundler.example) --------
ANS104_INDEX_FILTER={"always":true}
ANS104_UNBUNDLE_FILTER={"attributes":{"owner_address":"_AfaQWjzW9cnVIDMtb-ufTxSrgWLsvdWe0zxFm_AldE"}}

# Shared localstack S3 bucket so the gateway can serve data-item bytes the
# upload service stored (upstream default: unset -> no s3 data source)
AWS_ENDPOINT=http://localstack:4566
AWS_REGION=us-east-1
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
AWS_S3_CONTIGUOUS_DATA_BUCKET=ar.io
AWS_S3_CONTIGUOUS_DATA_PREFIX=data

# Serve on-demand data from local S3 only (default order starts with
# trusted-gateways which would reach out to arweave.net)
ON_DEMAND_RETRIEVAL_ORDER=s3

# Observer has no wallet configured; keep it idle
RUN_OBSERVER=false

# CRITICAL for local/chainless operation: the block importer crashes on
# ArLocal's genesis block (fromB64Url(undefined) -> uncaught exception loop).
# Disabling writers stops blockImporter/tx+bundle repair/mempool watcher but
# KEEPS the dataItemIndexer used by /ar-io/admin/queue-data-item (verified in
# ar-io-node/src/app.ts: only blockImporter & repair workers are gated).
START_WRITERS=false
