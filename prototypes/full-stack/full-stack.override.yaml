# PROTOTYPE — throwaway. Override for ../gateway-upload/ar-io-node/docker-compose.yaml
# that turns the proven gateway stack into the FULL stack:
#   - core host port remap 4000 -> 3004 (host 4000 taken by a sibling stack)
#   - arlocal (gateway "trusted node", as in the gateway-upload prototype)
#   - solana-validator: the proven solana-arns validator (AR.IO programs via
#     --upgradeable-program, mpl_core, 2MB NameRegistry preload), joined to
#     ar-io-network so core can reach http://solana-validator:8899.
# Program .so files / genesis account / upgrade-authority pubkey come from the
# sibling prototype (read-only mounts; paths relative to this file's dir).
services:
  core:
    ports: !override
      - '3004:4000'
    depends_on:
      solana-validator:
        condition: service_healthy

  arlocal:
    image: textury/arlocal:v1.1.66
    restart: unless-stopped
    ports:
      - '1984:1984'
    networks:
      - ar-io-network

  solana-validator:
    image: ghcr.io/beeman/solana-test-validator@sha256:419e56a8f2aeac073b7218cb16e982f4ad8ac44bec314b06bf6c2bc9f2756561
    security_opt:
      - seccomp=unconfined
    command:
      - solana-test-validator
      - --reset
      - --ledger
      - /workspace/test-ledger
      - --rpc-port
      - '8899'
      - --limit-ledger-size
      - '10000000'
      - --upgradeable-program
      - 8Njx9wPkXiNzDCgjwVsJFRjpAEV34gGW3n8DzX3V23m1 # ario_core
      - /data/ario_core.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX # admin = upgrade authority
      - --upgradeable-program
      - 7WsDTrtZBsfKtnP33XkjuqXCY69JE7n4QVYpynqJCFxz # ario_gar
      - /data/ario_gar.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX
      - --upgradeable-program
      - 6EZNezcg4rc5hnh8HG34vGquT3WpW5xXypzPb24uyEpp # ario_arns
      - /data/ario_arns.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX
      - --upgradeable-program
      - DbHbRwUD1oAn1mrDSqtWtvwGcNrmhWdD2g8L4xmeQ7NX # ario_ant
      - /data/ario_ant.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX
      - --upgradeable-program
      - bttco5oAnBwCucG63iKokBJCZmNr493f3Ewe9LM3oTx # ario_ant_escrow
      - /data/ario_ant_escrow.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX
      - --bpf-program
      - CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d # mpl_core
      - /data/mpl_core.so
      - --account
      - FPotW9q4i2pRsyADBwzWyiQremEanAGtnrKVbr4Kxn35 # NameRegistry PDA (2MB preload)
      - /genesis/name-registry.json
    volumes:
      - ../solana-arns/artifacts:/data:ro
      - ../solana-arns/genesis:/genesis:ro
    ports:
      - '8899:8899' # JSON-RPC
      - '8900:8900' # WebSocket (pubsub; driver scripts use it, core does not)
    networks:
      - ar-io-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        - CMD-SHELL
        - solana cluster-version -u http://127.0.0.1:8899
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
