# PROTOTYPE full-stack gateway env (used as --env-file for
# ../gateway-upload/ar-io-node/docker-compose.yaml + full-stack.override.yaml)
# (named *.conf because this workspace denies writing *.env files)
#
# = gateway-upload/gateway-env.conf (proven) + the NEW Solana/ArNS wiring
# (the actual thing under test in this prototype), marked NEW below.

ADMIN_API_KEY=proto-admin-key

# --- Cut mainnet: point the "trusted Arweave node" at local ArLocal ---------
TRUSTED_NODE_URL=http://arlocal:1984
TRUSTED_NODE_HOST=arlocal
TRUSTED_NODE_PORT=1984
FALLBACK_NODE_HOST=arlocal
FALLBACK_NODE_PORT=1984
ENABLE_ARWEAVE_PEER_EDS=false
ARWEAVE_PEER_DNS_RECORDS=arlocal

# Never broadcast tx/chunks to Arweave
ARWEAVE_POST_DRY_RUN=true

# --- Bundler integration (values prescribed by .env.bundler.example) --------
ANS104_INDEX_FILTER={"always":true}
ANS104_UNBUNDLE_FILTER={"attributes":{"owner_address":"_AfaQWjzW9cnVIDMtb-ufTxSrgWLsvdWe0zxFm_AldE"}}

# Shared localstack S3 bucket (gateway serves bytes the upload service stored)
AWS_ENDPOINT=http://localstack:4566
AWS_REGION=us-east-1
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
AWS_S3_CONTIGUOUS_DATA_BUCKET=ar.io
AWS_S3_CONTIGUOUS_DATA_PREFIX=data

ON_DEMAND_RETRIEVAL_ORDER=s3
RUN_OBSERVER=false
# CRITICAL: block importer crashes on ArLocal genesis; writers stay off
START_WRITERS=false

# ============================================================================
# NEW — gateway -> LOCAL validator ArNS resolution (the seam under test)
# ============================================================================

# Core reads ArNS registry + ANT state from the local validator instead of
# Solana mainnet-beta. The resolver path (SolanaARIOReadable +
# OnDemandArNSResolver/SolanaANTReadable) uses plain HTTP JSON-RPC only
# (createSolanaRpc in src/system.ts) — no :8900 websocket needed.
SOLANA_RPC_URL=http://solana-validator:8899

# Program ids actually loaded at validator genesis (= @ar.io/sdk
# DEVNET_PROGRAM_IDS = ar-io-solana-contracts program-ids/staging.json).
# Upstream compose defaults are the MAINNET ids, so all four must be set.
ARIO_CORE_PROGRAM_ID=8Njx9wPkXiNzDCgjwVsJFRjpAEV34gGW3n8DzX3V23m1
ARIO_GAR_PROGRAM_ID=7WsDTrtZBsfKtnP33XkjuqXCY69JE7n4QVYpynqJCFxz
ARIO_ARNS_PROGRAM_ID=6EZNezcg4rc5hnh8HG34vGquT3WpW5xXypzPb24uyEpp
ARIO_ANT_PROGRAM_ID=DbHbRwUD1oAn1mrDSqtWtvwGcNrmhWdD2g8L4xmeQ7NX

# Enables the ArNS subdomain middleware (and envoy's TVAL_ARNS_ROOT_HOST
# vhost). *.localhost resolves to 127.0.0.1 on modern resolvers; fallback is
# curl --resolve / an explicit Host header.
ARNS_ROOT_HOST=ar.localhost

# On-demand (chain) resolution only — the default appends a trusted-gateway
# fallback that would call https://__NAME__.turbo-gateway.com on every miss.
ARNS_RESOLVER_PRIORITY_ORDER=on-demand

# Names bought AFTER gateway boot: the base-name list is hydrated at boot and
# re-hydrated on a cache miss at most every
# ARNS_NAME_LIST_CACHE_MISS_REFRESH_INTERVAL_SECONDS (default 120). Shrink it
# so freshly bought names appear within ~seconds. Registry is tiny locally, so
# a full getProgramAccounts re-scan per miss is free.
ARNS_NAME_LIST_CACHE_MISS_REFRESH_INTERVAL_SECONDS=5
ARNS_NAME_LIST_CACHE_HIT_REFRESH_INTERVAL_SECONDS=30

# Keep resolution cache short so ANT record changes show up quickly
ARNS_CACHE_TTL_SECONDS=30
