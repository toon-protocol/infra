# TOON Protocol local development sandbox.
#
# One compose project: local chains (Solana validator with the AR.IO programs
# preloaded, Anvil for the EVM leg, ArLocal as the fake Arweave node) plus the
# AR.IO gateway stack (envoy + core + redis) and the Turbo bundler stack
# (upload-service + fulfillment + postgres + localstack), wired together so
# that `upload via local Turbo -> buy ArNS name -> serve at
# http://<name>.ar.localhost:3000/` works fully locally.
#
# Built from three proven prototypes (see prototype/local-ar-io-stack branch:
# prototypes/{solana-arns,gateway-upload,full-stack}); the hard-won facts are
# annotated inline. The AR.IO gateway/bundler service definitions are vendored
# from ar-io-node r83's docker-compose.yaml / docker-compose.bundler.yaml
# (trimmed to the env this sandbox actually sets) so this file is
# self-contained — no ar-io-node checkout required. Image tags are the exact
# SHAs the r83 compose files shipped (and the prototypes verified).
#
# See README.md for the cold-start guide; `make up` / `make smoke`.
name: toon-sandbox

# ── Profiles ────────────────────────────────────────────────────────────────
# EVERY service carries a profile, deliberately: a compose invocation that
# selects none then renders an EMPTY project and does nothing at all, which is
# obvious, instead of silently bringing up some partial stack that looks like
# the sandbox and is not. The Makefile is the entry point and always
# selects one — `make up` passes --profile full, which is every service in
# this file, exactly what `make up` started before profiles existed. Driving
# compose by hand needs the
# flag too (`docker compose --profile full ps`), or export COMPOSE_PROFILES=full
# in your shell / a local sandbox/.env once. A --profile flag on the command
# line REPLACES COMPOSE_PROFILES rather than adding to it.
#
#   full      every service — the full-stack proof, the sandbox's default.
#   payments  the PAYMENT LAYER ONLY, for someone iterating on a TOON client
#             or on their own route and who has no store sibling checkout:
#               anvil                      client-leg settlement (EVM)
#               solana-validator           peer-leg settlement + payment_channel
#               seed-toon-evm              funds the EVM settlement keys
#               seed-toon-solana           mock USDC mint + funds/ATAs
#               relay                      the hub's one TERMINATED paid route
#                                          (g.toon.relay -> relay:3100/write),
#                                          i.e. the only destination a paid
#                                          packet can reach without a peer
#               relay-connector            the hub itself
#               open-toon-solana-channels  opens the hub's Solana channels
#               provider, provider-connector
#                                          the compute provider (TOON_Network
#                                          Milestone 1) and its own connector,
#                                          peered to the hub — the sandbox's
#                                          Level 2 example that needs no
#                                          sibling checkout beyond ../../provider
#               directory-publisher        that provider's payer for RELAY
#                                          WRITES: its Profile, Listings and
#                                          Liveness are PAID g.toon.relay
#                                          packets, never the free ephemeral
#                                          lane (TOON_Network ADR 0007)
#               provider2, provider2-connector, directory-publisher2
#                                          THE SECOND PROVIDER (TOON_Network
#                                          #34, Milestone 3), the same three
#                                          services again: a Standby Set spans
#                                          two providers, so the sandbox has
#                                          two — own identity, own connector
#                                          on :3250, own channel, own payer
#             Everything else — the AR.IO gateway + Turbo bundler, the store,
#             gas-station and Anyone credentials-issuer subsystems and their
#             three peering connectors — stays out (the `credentials` profile
#             below adds back exactly the issuer path and the market; the rest
#             is `full` only). The hub still LOADS all three peerings under
#             `payments`; a peering whose far side is not serving simply
#             answers T01, which is why relay-connector's depends_on marks
#             those peers `required: false` (a required dependency that is
#             disabled by profile is a hard config error, not a warning).
#   credentials
#             `payments` PLUS the paid side of the DENOMINATION BOUNDARY, for
#             someone writing a TOON client that buys Anyone credentials —
#             the group `payments` helps least, because the peer it needs is
#             precisely the one `payments` leaves out. Adds:
#               issuer-keys, issuer-migrate, issuer,
#               issuer-postgres, issuer-redis  the paid counterparty
#               claim-minter               turns the connector's statement of
#                                          who paid into the issuer's claim
#               anytoon-connector          terminates g.anyone.credentials in
#                                          ANYONE; the far side of the boundary
#               swap-driver                keeps the TWAP fresh — without it
#                                          nothing trades, the ANYONE rate
#                                          goes stale in minutes, the crossing
#                                          refuses T00 and no bundle can be
#                                          bought at all
#             Needs the anytoon sibling checkout (claim-minter builds from it)
#             but NOT the store checkout — the point of the profile: under
#             `full` the boundary is reachable only with both on disk. Entry
#             points `make up-credentials` + `make smoke-credentials`. A
#             deliberate `docker compose stop swap-driver` here is the cheap
#             way to exercise the T00 stale-rate refusal on a route that HAS a
#             live counterparty (T00: retry on a backoff, each attempt spends
#             its covering claim — vs F02, no rate declared, where config is
#             immutable for the process lifetime and retrying never works).
#   hs        THREE EXTRA SERVICES ON TOP OF `full`, never on their own and
#             never part of it: the `anon` daemon that publishes a `.anyone`
#             hidden service in front of the anytoon issuer path, the
#             `hs-ingress` forwarder whose network namespace it shares, and the
#             `anon-client` SOCKS5 proxy a buyer dials through. OPT-IN, and it
#             must stay that way: `anon` bootstraps against the REAL Anyone
#             network, so anything on this profile takes a third-party
#             dependency and a sandbox whose cold start can go red because a
#             relay network had a bad day has stopped being a sandbox. Entry
#             point `make up-hs` (= --profile full --profile hs) + `make
#             smoke-hs`; `make up` and `make smoke` never render it. See the
#             "The hidden-service ingress" section at the bottom of this file.
#   gateway   TWO EXTRA SERVICES ON TOP OF `full` (or `payments`), never on
#             their own: the WORKLOAD GATEWAY (TOON_Network ADR 0013, spec
#             §12, Milestones 5 and 6) — a stable hostname per workload, keyed
#             by its workload id, resolved to whichever provider is running
#             it — and its own connector, which terminates ONE FREE route: the
#             sealed Gateway Handover a tenant sends it (scripts/handover.mjs),
#             its whole authority. It holds no lease and pays nothing, and
#             NOTHING ON THIS PATH IS PUBLISHED. Entry point `make up-gateway`
#             (= --profile full --profile gateway; `COMPOSE_PROFILE=payments`
#             for the payment layer alone) + `curl http://<label>.gw.localhost:3280/`.
#             Nothing in `full` names it and it names nothing `hs`-only:
#             `make up-gateway-hs` adds it on top of `make up-hs` for the
#             hidden path by hand. See "The Workload Gateway" below.
#
# `make up` / `make up-payments` / `make up-credentials` / `make up-hs` /
# `make up-gateway` are the supported entry points; see Makefile.

# Bounded json-file logs for the chatty chain services (the validator prints a
# status line ~30x/sec; an unrotated log once helped fill a dev box's disk —
# see connector/docker-compose.yml's incident note).
x-chain-logging: &chain-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Chains
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # Local Solana validator with AR.IO's five Anchor programs + Metaplex Core
  # preloaded at genesis, plus the pre-created 2MB NameRegistry account.
  #
  # PROVEN FACTS (do not "simplify" these away):
  #  - The five AR.IO programs MUST be loaded with --upgradeable-program, NOT
  #    --bpf-program: their `initialize` instructions gate on the program's
  #    upgrade authority via the BPF upgradeable-loader ProgramData account,
  #    which plain --bpf-program never creates. Upgrade authority = the
  #    committed throwaway keys/admin.json
  #    (5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX).
  #  - Program ids = @ar.io/sdk DEVNET_PROGRAM_IDS = ar-io-solana-contracts
  #    program-ids/staging.json. The dumped .so files carry declare_id! for
  #    exactly these ids, so they cannot be changed independently.
  #  - The NameRegistry PDA (2,000,048 bytes) is preloaded via --account
  #    (on-chain creation would need ~200 transactions).
  #  - Do NOT add --bind-address 0.0.0.0: agave 4.1.1 panics on it
  #    (UnspecifiedIpAddr). RPC listens on all interfaces anyway.
  #  - seccomp=unconfined is required (Agave v2+ uses io_uring).
  #  - Image is community-maintained and frozen (nightly builds stopped
  #    2026-07-06; agave 4.1.1 at this digest). Fallback if it ever breaks:
  #    a tiny Dockerfile over Anza release binaries.
  solana-validator:
    profiles: ['payments', 'credentials', 'full']
    image: ghcr.io/beeman/solana-test-validator@sha256:419e56a8f2aeac073b7218cb16e982f4ad8ac44bec314b06bf6c2bc9f2756561
    security_opt:
      - seccomp=unconfined
    command:
      - solana-test-validator
      - --reset
      - --ledger
      - /workspace/test-ledger
      - --rpc-port
      - '8899'
      - --limit-ledger-size
      - '10000000'
      - --upgradeable-program
      - 8Njx9wPkXiNzDCgjwVsJFRjpAEV34gGW3n8DzX3V23m1 # ario_core
      - /data/ario_core.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX # admin = upgrade authority (keys/admin.json)
      - --upgradeable-program
      - 7WsDTrtZBsfKtnP33XkjuqXCY69JE7n4QVYpynqJCFxz # ario_gar
      - /data/ario_gar.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX
      - --upgradeable-program
      - 6EZNezcg4rc5hnh8HG34vGquT3WpW5xXypzPb24uyEpp # ario_arns
      - /data/ario_arns.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX
      - --upgradeable-program
      - DbHbRwUD1oAn1mrDSqtWtvwGcNrmhWdD2g8L4xmeQ7NX # ario_ant
      - /data/ario_ant.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX
      - --upgradeable-program
      - bttco5oAnBwCucG63iKokBJCZmNr493f3Ewe9LM3oTx # ario_ant_escrow
      - /data/ario_ant_escrow.so
      - 5ncaUQEykDpzYaWHAxQ16M3Kq49hxzo6xXUWkVXC3TXX
      - --bpf-program
      - CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d # mpl_core (canonical mainnet id; plain --bpf-program is fine, no init gate)
      - /data/mpl_core.so
      - --account
      - FPotW9q4i2pRsyADBwzWyiQremEanAGtnrKVbr4Kxn35 # NameRegistry PDA (pre-created, 2MB)
      - /data/genesis/name-registry.json
      # ── TOON payment-channel program (connector) ──────────────────────
      # Committed BPF artifact (artifacts/payment_channel.so), built from the
      # connector repo with its pinned toolchain: `make solana-build` there
      # (platform-tools v1.52 via tools/solana/build-sbf.sh) produces
      # connector/target/deploy/payment_channel.so; see
      # scripts/build-payment-channel.sh for the exact regeneration steps.
      # Loaded with plain --bpf-program under the BARE id the connector's
      # local tooling shares (infra/solana/entrypoint.sh there) — no init
      # gate, so no --upgradeable-program needed.
      - --bpf-program
      - HY4AYFNe5Vg5BkEwAURNsGY3uFAvGMNpAQPRtgoasJiR # payment_channel (TOON connector)
      - /data/payment_channel.so
    volumes:
      - ./artifacts:/data:ro
    ports:
      - '8899:8899' # JSON-RPC
      - '8900:8900' # WebSocket (pubsub; driver scripts use it, the gateway does not)
    logging: *chain-logging
    healthcheck:
      test:
        - CMD-SHELL
        - solana cluster-version -u http://127.0.0.1:8899
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Local EVM chain with the connector's settlement contracts AUTO-DEPLOYED
  # (MockERC20 USDC 0x5FbDB…0aa3, TokenNetworkRegistry 0xe7f1…0512, and the
  # TokenNetwork the registry creates at 0xCafa…052c — deterministic outputs
  # of DeployLocal.s.sol run by anvil account 0 at fixed nonces).
  #
  # This is the connector repo's own proven in-container forge pattern,
  # vendored from ../../connector/docker-compose.yml (see its extensive
  # comments for the incident history behind every line). It REQUIRES the
  # connector sibling checkout: the Foundry project is bind-mounted
  # READ-WRITE from ../../connector/packages/contracts (forge writes out/,
  # cache/, broadcast/ and — on a checkout without submodules — lib/ into
  # it), which is why the service runs as the invoking user (HOST_UID/GID,
  # exported by the Makefile) with HOME=/tmp (an arbitrary uid has no
  # /etc/passwd entry; forge needs a writable home for ~/.svm).
  anvil:
    profiles: ['payments', 'credentials', 'full']
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    environment:
      HOME: /tmp
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo "Starting Anvil..."
        # --timestamp STARTS THE CHAIN 900 SECONDS IN THE PAST, and that is
        # load-bearing rather than cosmetic. anvil's clock runs at wall speed
        # from whatever genesis it is given, and `evm_increaseTime` shifts that
        # offset permanently. seed-toon-evm-amm.sh consumes exactly 900s of
        # increaseTime priming the Uniswap oracles (an observation is only
        # written when a swap touches a pool, so history has to be walked
        # forward), which brings the chain back to real time just as the
        # connectors start. A chain left running EARLY would make every TWAP
        # look permanently fresh; one left running LATE would make every one
        # look permanently stale, and the ANYONE pair would refuse T00 from the
        # first packet. See conf/amm-topology.conf (PRIME_SPAN_SECS).
        anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 10000 \
          --timestamp $$(( $$(date +%s) - 900 )) &
        ANVIL_PID=$$!

        until cast client --rpc-url http://localhost:8545 2>/dev/null | grep -q 'anvil'; do
          sleep 1
        done

        echo "Deploying connector contracts..."
        cd /contracts

        # Submodule self-heal for a checkout cloned without --recursive,
        # PINNED to the revisions packages/contracts/foundry.lock commits
        # (unpinned forge install once dragged in a wrong OpenZeppelin —
        # connector#1121). One lib at a time, rm -rf first, so a
        # half-installed tree is repaired rather than fatal.
        install_lib() {
          if [ -f "$$3" ]; then
            return 0
          fi
          echo "Foundry lib $$1 is missing — installing $$2..."
          rm -rf "$$1"
          forge install "$$2" --no-git
        }
        install_lib lib/forge-std \
          foundry-rs/forge-std@rev=1801b0541f4fda118a10798fd3486bb7051c5dd6 \
          lib/forge-std/src/Script.sol
        install_lib lib/openzeppelin-contracts \
          OpenZeppelin/openzeppelin-contracts@rev=fcbae5394ae8ad52d8e580a3477db99814b9d565 \
          lib/openzeppelin-contracts/contracts/access/Ownable.sol

        # DeployLocal (the connector's own script, account 0) and then the
        # SANDBOX-OWNED extras (contracts/DeploySandboxExtras.s.sol, mounted
        # read-only at /sandbox-extras — forge accepts an out-of-root script
        # path, so nothing is ever created inside the connector checkout;
        # account 9, nonces 0-1 so its addresses are deterministic regardless
        # of DeployLocal's shape): the OZ v5.5.0 ERC2771Forwarder + the
        # ERC-2771 probe target kind:5098 relays to.
        # Then THE EVM ASSET LAYER, in the same shell and before the
        # healthcheck can pass: the real mainnet ANYONE and WETH9 bytecode,
        # ANYONE's TokenNetwork, real Uniswap v3, two seeded pools and 900
        # seconds of primed oracle history. It runs here rather than as an
        # init job because the hub and the anytoon node BOTH refuse to start
        # unless ANYONE resolves a TokenNetwork, and the hub's rate poller has
        # nothing to read until the pools exist.
        if forge script script/DeployLocal.s.sol:DeployLocalScript \
             --rpc-url http://localhost:8545 --broadcast --skip-simulation \
           && forge script /sandbox-extras/DeploySandboxExtras.s.sol:DeploySandboxExtrasScript \
             --rpc-url http://localhost:8545 --broadcast --skip-simulation \
           && RPC_URL=http://localhost:8545 sh /sandbox-scripts/seed-toon-evm-amm.sh; then
          echo "Anvil ready with contracts deployed!"
        else
          echo "============================================================"
          echo "CONTRACT DEPLOY FAILED. This anvil is serving an EMPTY or"
          echo "PARTIAL chain; it will never pass its healthcheck and nothing"
          echo "that settles can start against it. The forge output above is"
          echo "the reason."
          echo "============================================================"
        fi

        wait $$ANVIL_PID
    volumes:
      # The connector SIBLING checkout is required (documented in README.md).
      - ../../connector/packages/contracts:/contracts
      # Sandbox-owned extras scripts, mounted OUTSIDE the project so docker
      # never creates a mountpoint file in the connector checkout (forge's
      # out/cache/broadcast writes there happen either way, as documented).
      - ./contracts:/sandbox-extras:ro
      # The EVM asset layer: its shell script, the numbers it builds from, and
      # the committed mainnet/Uniswap bytecode it places.
      - ./scripts:/sandbox-scripts:ro
      - ./conf:/sandbox-conf:ro
      - ./artifacts/evm:/sandbox-artifacts:ro
    ports:
      - '8545:8545'
    restart: unless-stopped
    logging: *chain-logging
    # Healthy means THE FULL DEPLOY LANDED, not merely that the RPC answers:
    # everything downstream (connectors, seed-toon-evm, gas-station) would
    # otherwise race the deploy. Three gates, in the order they are produced:
    # the registry (DeployLocal), the ERC-2771 probe (DeploySandboxExtras), and
    # — last and strongest — a live `observe()` over the ANYONE/WETH pool's
    # 300-second TWAP window. That last one is the whole asset layer in one
    # call: it can only answer if the token bytecode landed, the factory
    # deployed, the pool was created and initialised, its observation
    # cardinality was grown and 900 seconds of history were primed. Without it
    # the hub would boot against a pool that reverts OLD, price NOTHING, and
    # refuse every credentials purchase F02 with a green stack.
    # cast code returns 0x until a deploy lands and empty output on RPC
    # failure, hence the -n checks.
    healthcheck:
      test:
        - CMD-SHELL
        - "r=\"$$(cast code 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512 --rpc-url http://localhost:8545 2>/dev/null)\"; p=\"$$(cast code 0xA15BB66138824a1c7167f5E85b957d04Dd34E468 --rpc-url http://localhost:8545 2>/dev/null)\"; test -n \"$$r\" && test \"$$r\" != '0x' && test -n \"$$p\" && test \"$$p\" != '0x' && cast call 0x8983f1366e1c0d20647c9a1b0cb46ce4c46e13c7 'observe(uint32[])(int56[],uint160[])' '[300,0]' --rpc-url http://localhost:8545 >/dev/null 2>&1 || exit 1"
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  # Fake Arweave node. Frozen upstream (repo archived) but still what the
  # ecosystem uses locally. Serves as the gateway's "trusted node" (envoy
  # upstreams, tx-anchor lookups) — the gateway's SYNC pipeline must never
  # point at it (core's block importer crashes on ArLocal's minimal genesis;
  # that is why gateway.conf sets START_WRITERS=false).
  arlocal:
    profiles: ['full']
    image: textury/arlocal:v1.1.66
    restart: unless-stopped
    ports:
      - '1984:1984'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Init jobs (one-shot; each is idempotent)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # Seeds the validator so ArNS buys work: airdrop SOL, create a local "ARIO"
  # SPL mint, treasury + buyer ATAs, mint ARIO to the buyer, then
  # ario_arns::initialize + ario_core::initialize (signer = the programs'
  # upgrade authority). Exits 0 immediately if the ArnsConfig PDA already
  # exists. Note: the validator runs with --reset, so a *restart* of that
  # container wipes chain state — a later `make up` re-runs this job and
  # reseeds (see README "Restarting the validator").
  seed-solana:
    profiles: ['full'] # ARIO mint + ArNS/core initialize — store side only
    build: .
    restart: 'no'
    environment:
      RPC_URL: http://solana-validator:8899
      WS_URL: ws://solana-validator:8900
    volumes:
      - ./keys:/app/keys:ro
    command: ['node', 'scripts/seed-solana.mjs']
    depends_on:
      solana-validator:
        condition: service_healthy

  # Seeds one fake head block (height 1) into core's SQLite. Required by the
  # Turbo upload service, which resolves the current block height via the
  # gateway's GraphQL to compute receipt deadlineHeight — on a chainless
  # gateway every upload would 503 ("Unable to sign receipt... Failed to
  # fetch block info"). Runs the core image itself (it ships node +
  # better-sqlite3) against the shared sqlite bind mount. Idempotent
  # (INSERT OR REPLACE of the same row).
  seed-gateway-block:
    profiles: ['full']
    image: ghcr.io/ar-io/ar-io-core:4704625fe2587cdca2c53828dbc5ceefbd22b4b2
    restart: 'no'
    entrypoint: ['/bin/sh', '/seed/seed-head-block.sh']
    volumes:
      - ./data/gateway/sqlite:/app/data/sqlite
      - ./scripts/seed-head-block.sh:/seed/seed-head-block.sh:ro
    depends_on:
      core:
        condition: service_healthy

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AR.IO gateway stack (vendored from ar-io-node r83 docker-compose.yaml)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Deviation from the prototypes: the observer service is dropped entirely
  # (it only crash-looped there — no observer wallet, RUN_OBSERVER=false).
  # Envoy's observer cluster points at `core` instead; /ar-io/observer
  # routes 503, which nothing in the sandbox uses.

  envoy:
    profiles: ['full']
    image: ghcr.io/ar-io/ar-io-envoy:a487df83812f30d8753d89d28f45200606c64678
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - LOG_LEVEL=info
      - TVAL_AR_IO_HOST=core
      - TVAL_AR_IO_PORT=4000
      - TVAL_OBSERVER_HOST=core # observer not run in the sandbox (see above)
      - TVAL_OBSERVER_PORT=5050
      - TVAL_TRUSTED_NODE_HOST=arlocal # cut mainnet: default is arweave.net
      - TVAL_TRUSTED_NODE_PORT=1984
      - TVAL_FALLBACK_NODE_HOST=arlocal # default is peers.arweave.xyz
      - TVAL_FALLBACK_NODE_PORT=1984
      - TVAL_GRAPHQL_HOST=core
      - TVAL_GRAPHQL_PORT=4000
      - TVAL_GRAPHQL_HOST_HEADER=
      - TVAL_DATASETS_HOST=core
      - TVAL_DATASETS_PORT=4000
      - TVAL_ARNS_ROOT_HOST=ar.localhost # enables the ArNS subdomain vhost
      - TVAL_ARWEAVE_POST_DRY_RUN=true
      - TVAL_ENABLE_ARWEAVE_PEER_EDS=false # stop envoy's mainnet peer discovery
      - TVAL_ARWEAVE_PEER_DNS_RECORDS=arlocal
      - TVAL_ARWEAVE_PEER_DNS_PORT=1984
      - TVAL_ARIO_GATEWAY_UPSTREAM_IDLE_TIMEOUT=55s
      - TVAL_ARIO_GATEWAY_MAX_CONNECTIONS=16384
      - TVAL_ARIO_GATEWAY_MAX_PENDING_REQUESTS=16384
      - TVAL_ARIO_GATEWAY_MAX_REQUESTS=16384
      - TVAL_ARIO_GATEWAY_RETRY_BUDGET_PERCENT=20
    volumes:
      - envoy-eds-data:/data/envoy-eds
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - core

  core:
    profiles: ['full']
    image: ghcr.io/ar-io/ar-io-core:4704625fe2587cdca2c53828dbc5ceefbd22b4b2
    restart: unless-stopped
    ports:
      # Host 3004 (host 4000 is commonly taken by sibling stacks). Envoy
      # derives its upstream port from the container port, so the remap must
      # stay on the host side only.
      - '3004:4000'
    volumes:
      - ./data/gateway/chunks:/app/data/chunks
      - ./data/gateway/contiguous:/app/data/contiguous
      - ./data/gateway/headers:/app/data/headers
      - ./data/gateway/sqlite:/app/data/sqlite
      - ./data/gateway/duckdb:/app/data/duckdb
      - ./data/gateway/tmp:/app/data/tmp
      - ./data/gateway/lmdb:/app/data/lmdb
      - ./data/gateway/parquet:/app/data/parquet
      - ./data/gateway/datasets:/app/data/datasets
      - ./data/gateway/etl-staging:/app/data/etl/staging
      - ./data/gateway/cdb64-root-tx-index:/app/data/cdb64-root-tx-index
      - ./data/gateway/keys:/app/data/keys
      - envoy-eds-data:/app/data/envoy-eds
    env_file:
      - conf/gateway.conf
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # The image ships its own HEALTHCHECK (GET /ar-io/healthcheck) with a 30s
    # interval; tighten it so dependents gate faster.
    healthcheck:
      test: ['CMD', '/bin/sh', 'healthcheck.sh']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      redis:
        condition: service_started
      arlocal:
        condition: service_started
      # Boot-time ArNS name-list hydration targets a live RPC.
      solana-validator:
        condition: service_healthy

  redis:
    profiles: ['full']
    image: redis:7
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Turbo bundler stack (vendored from ar-io-node r83
  # docker-compose.bundler.yaml)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Reached through the gateway: turbo-sdk -> http://localhost:3000/bundler
  # (envoy proxies /bundler to upload-service:5100 — the service NAME is
  # load-bearing, envoy's cluster targets it by DNS).

  upload-service:
    profiles: ['full']
    image: ghcr.io/ardriveapp/turbo-upload-service:fd1032e3012c0179577b08bbfe932f4ad7d805cd
    restart: on-failure
    env_file:
      - conf/bundler.conf
    environment:
      ARWEAVE_GATEWAY: http://envoy:3000
      PORT: '5100'
      DB_HOST: upload-service-pg
      DB_PORT: '5432'
      DB_PASSWORD: postgres
      MAX_DATA_ITEM_SIZE: '10737418240'
      SQS_PREPARE_BUNDLE_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/prepare-bundle-queue
      SQS_FINALIZE_UPLOAD_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/finalize-multipart-queue
      SQS_OPTICAL_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/optical-post-queue
      SQS_NEW_DATA_ITEM_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/batch-insert-new-data-items-queue
      SQS_UNBUNDLE_BDI_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/bdi-unbundle-queue
      OPTICAL_BRIDGING_ENABLED: 'true'
      LOG_LEVEL: info
      MIGRATE_ON_STARTUP: 'true'
    ports:
      - '5100:5100'
    volumes:
      - ./data/upload-service:/temp
    depends_on:
      upload-service-pg:
        condition: service_started
      fulfillment-service:
        condition: service_started
      # Receipt signing needs the fake head block (GraphQL block height).
      seed-gateway-block:
        condition: service_completed_successfully

  fulfillment-service:
    profiles: ['full']
    image: ghcr.io/ardriveapp/turbo-upload-service-fulfillment:6299f5497f5de479a1fb17ec86b764a4bf018f7b
    restart: on-failure
    env_file:
      - conf/bundler.conf
    environment:
      ARWEAVE_GATEWAY: http://envoy:3000 # bundles POST to the local gateway (dry-run there)
      DB_HOST: upload-service-pg
      DB_PORT: '5432'
      DB_PASSWORD: postgres
      PORT: '4401'
      SQS_PREPARE_BUNDLE_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/prepare-bundle-queue
      SQS_POST_BUNDLE_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/post-bundle-queue
      SQS_SEED_BUNDLE_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/seed-bundle-queue
      SQS_FINALIZE_UPLOAD_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/finalize-multipart-queue
      SQS_OPTICAL_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/optical-post-queue
      SQS_NEW_DATA_ITEM_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/batch-insert-new-data-items-queue
      SQS_UNBUNDLE_BDI_URL: http://sqs.us-east-1.localstack.localstack.cloud:4566/000000000000/bdi-unbundle-queue
      PLAN_BUNDLE_ENABLED: 'true'
      # Deviation from the prototypes (which kept the default true): with no
      # real chain the bundle can never confirm, so verification errors once
      # a minute forever. Off = same behavior minus the log noise.
      VERIFY_BUNDLE_ENABLED: 'false'
      OPTICAL_BRIDGING_ENABLED: 'true'
      OPTICAL_BRIDGE_URL: http://envoy:3000/ar-io/admin/queue-data-item
      OVERDUE_DATA_ITEM_THRESHOLD_MS: '0' # plan all data items into bundles immediately
    depends_on:
      localstack:
        condition: service_healthy
      upload-service-pg:
        condition: service_started
      seed-gateway-block:
        condition: service_completed_successfully

  upload-service-pg:
    profiles: ['full']
    image: postgres:13.8
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./data/upload-service-pg:/var/lib/postgresql/data

  localstack:
    profiles: ['full']
    image: ghcr.io/ardriveapp/turbo-upload-service-localstack:6299f5497f5de479a1fb17ec86b764a4bf018f7b
    restart: on-failure
    ports:
      - '4566:4566'
    env_file:
      # Provides ARWEAVE_WALLET / TURBO_OPTICAL_KEY (the bundler identity,
      # loaded into localstack's secretsmanager by its init) and
      # DATA_ITEM_BUCKET.
      - conf/bundler.conf
    environment:
      - SERVICES=s3,sqs,secretsmanager
      - DEBUG=0
      - PERSIST_DEFAULT=1
    volumes:
      - ./data/localstack:/var/lib/localstack
      - ./data/localstack:/persisted-data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:4566/_localstack/health || exit 1
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 15s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # TOON payment layer: four connectors + relay + store + gas-station +
  # the Anyone credentials issuer
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Topology (peering = the connector repo's CI-proven static config-file
  # mechanism, local/two-hop + local/mixed-chain there; ADR 0060/0028/0042):
  #
  #   client ──POST /ilp──▶ relay-connector (hub, :3200)
  #             g.toon.relay            ──▶ relay:3100/write         (paid)
  #             g.toon.store            ──peering──▶ store-connector ──▶ store:3300/store
  #             g.toon.gastation        ──peering──▶ gas-connector   ──▶ gas-station:3300/gas
  #             g.anyone.credentials    ──peering──▶ anytoon-connector ──▶ claim-minter:8080 ──▶ issuer:3000
  #             g.anyone.credentials.keys ──peering──▶ anytoon-connector ──▶ issuer:3000/v1/keys/ (price 0 there)
  #             g.toon.provider.*       ──peering──▶ provider-connector ──▶ provider:8080/… (spawn/extend paid, the rest free)
  #   any client ──ws──▶ relay:7100 (free reads, host :7100)
  #
  # CROSS-CHAIN, SAME-ASSET: the client leg (smoke -> hub) settles on ANVIL
  # (EVM mock USDC), while ALL THREE peering legs settle on the LOCAL VALIDATOR —
  # real payment_channel-program channels in the Solana mock USDC mint. Both
  # mocks are 6-decimal USDC, so amounts cross the boundary unconverted
  # (conversion/FX is explicitly unsupported). The Solana channels are opened
  # AFTER the hub boots by the open-toon-solana-channels init job, through
  # the hub's own operator surface — the repo's only InitializeChannel
  # submitter (connector/local/mixed-chain is the upstream proof of this
  # exact shape). Every connector still runs both settlement backends;
  # Solana startup submits a real ATA-create and simulates an
  # InitializeChannel against the genesis-loaded payment_channel program.
  #
  # Key material under keys/toon/ is committed valueless throwaway (see
  # scripts/gen-toon-keys.sh); configs under conf/connector-*.toml. The
  # connector image runs as uid 10001: key dirs are bind-mounted READ-ONLY
  # (world-readable files suffice), state dirs are NAMED VOLUMES (a fresh
  # named volume inherits the image's uid-10001 /app/state ownership; a bind
  # mount arrives root-owned and the connector refuses to start).

  # One-shot: mock USDC mint + SOL/USDC for every settlement key (Solana leg).
  seed-toon-solana:
    profiles: ['payments', 'credentials', 'full']
    build: .
    restart: 'no'
    environment:
      RPC_URL: http://solana-validator:8899
      WS_URL: ws://solana-validator:8900
    volumes:
      - ./keys:/app/keys:ro
    command: ['node', 'scripts/seed-toon-solana.mjs']
    depends_on:
      solana-validator:
        condition: service_healthy

  # One-shot: ETH + mock USDC + ANYONE for every settlement key, and the one
  # EVM payment channel in this sandbox — the relay-anytoon peering, settled in
  # ANYONE. (The client leg and the other two peerings settle on Solana.)
  seed-toon-evm:
    profiles: ['payments', 'credentials', 'full']
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    restart: 'no'
    entrypoint: ['/bin/sh', '/seed/seed-toon-evm.sh']
    environment:
      RPC_URL: http://anvil:8545
      KEYS_DIR: /keys
    volumes:
      - ./scripts/seed-toon-evm.sh:/seed/seed-toon-evm.sh:ro
      - ./conf/amm-topology.conf:/sandbox-conf/amm-topology.conf:ro
      - ./keys/toon:/keys:ro
    depends_on:
      anvil:
        condition: service_healthy

  # One-shot, POST-BOOT: opens + collateralises the two SOLANA peering
  # channels through the HUB's operator surface (the payer node is the only
  # possible submitter — InitializeChannel is a positional account list no
  # chain CLI can build, and the program's Deposit credits strictly by
  # signer). Vendored connector/local/open-solana-channel.py; refuses success
  # unless the chain's own account layout agrees with the committed configs.
  open-toon-solana-channels:
    # In the `payments` and `credentials` profiles the two counterparty
    # connectors are not running, but nothing here talks to them: the channels
    # are opened by the HUB against the peers' committed Solana settlement
    # PUBLIC keys, so both accounts still land on chain and the Solana leg is
    # still proven.
    profiles: ['payments', 'credentials', 'full']
    image: python:3.12-slim
    restart: 'no'
    entrypoint: ['/bin/sh', '/seed/seed-toon-solana-channels.sh']
    environment:
      RPC_URL: http://solana-validator:8899
      HUB_OPERATOR_URL: http://relay-connector:3000
      KEYS_DIR: /keys
    volumes:
      - ./scripts/seed-toon-solana-channels.sh:/seed/seed-toon-solana-channels.sh:ro
      - ./scripts/open-solana-channel.py:/seed/open-solana-channel.py:ro
      - ./keys/toon:/keys:ro
    depends_on:
      relay-connector:
        condition: service_healthy

  # LONG-LIVED: the only thing in this sandbox that trades. A Uniswap v3 pool
  # writes an oracle observation in `swap` and nowhere else, and anvil mines a
  # block only when a transaction arrives — so without this loop the hub's
  # ANYONE TWAP would be a frozen constant AND its `observed_at` (the head
  # block's own timestamp) would stop advancing, taking the pair stale one
  # `ttl_secs` later. It steers ANYONE/WETH as a bounded triangle wave and pins
  # WETH/USDC; see scripts/swap-driver.sh and conf/amm-topology.conf.
  #
  # NEVER on `payments`, on purpose. That profile proves the payment layer, and
  # its one converting route (g.anyone.credentials) has no anytoon node to
  # reach there anyway — so it gets the pools (anvil builds them either way,
  # because the hub cannot boot without ANYONE's TokenNetwork) but not the
  # market. The hub will log a stale ANYONE pair a couple of minutes into a
  # payments run; nothing on that profile's path reads it.
  #
  # On `credentials` it is LOAD-BEARING, not a nicety: that profile exists to
  # buy bundles across the boundary, the crossing converts at this market's
  # TWAP, and with nothing trading the rate goes stale one ttl_secs after the
  # last block — the hub then refuses every purchase T00. (Stopping this
  # service deliberately is how that refusal path is exercised; see the
  # Profiles block at the top.)
  swap-driver:
    profiles: ['credentials', 'full']
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/seed/swap-driver.sh']
    environment:
      RPC_URL: http://anvil:8545
    volumes:
      - ./scripts/swap-driver.sh:/seed/swap-driver.sh:ro
      - ./conf/amm-topology.conf:/sandbox-conf/amm-topology.conf:ro
    depends_on:
      anvil:
        condition: service_healthy
    logging: *chain-logging

  # ── The apps ─────────────────────────────────────────────────────────────

  # Nostr relay. Write port 3100 is deliberately UNPUBLISHED — the only route
  # to it is a paid packet through relay-connector (the relay skips schnorr
  # verification for paid ephemeral kinds on exactly that guarantee). Reads
  # (7100) are free NIP-01 over WebSocket.
  relay:
    # In `payments` too: g.toon.relay is the hub's only TERMINATED route, so
    # this is the one destination a paid packet can reach with no peer running
    # — i.e. what makes "a paid request against the hub settles" testable.
    profiles: ['payments', 'credentials', 'full']
    image: ghcr.io/toon-protocol/relay@sha256:2c628e86b05c7c1f860285d4e876e841934aaca5aafb59c2e6fa31b367da2683 # :release, 2026-09
    env_file:
      - conf/relay.conf
    volumes:
      - relay-data:/data
    expose:
      - '3100' # writes — PRIVATE, only relay-connector dials this
    ports:
      - '7100:7100' # free NIP-01 reads
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3100/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    logging: *chain-logging

  # Paid Arweave blob store (kind:5094 blob upload + kind:5095 ArNS: op=prepare
  # ANT-spawn composition and op=buy brokered name purchase). Handler port 3300
  # is UNPUBLISHED for the same reason as the relay's write port; the free
  # health/describe surface (BLS, container port 3400) is published at host
  # 3300. Uploads aim straight at the LOCAL Turbo upload service and the
  # kind:5095 buy at the LOCAL validator via the STORE_TURBO_UPLOAD_URL /
  # ARNS_SOLANA_*_URL env overrides (conf/store.conf) — which is why the image
  # is BUILT from the store sibling checkout carrying that change
  # (feat/local-endpoint-overrides) instead of pulled: the pinned upstream
  # release predates the overrides and can only reach upload.ardrive.io.
  # Once upstream ships them, the pin works again:
  #   image: ghcr.io/toon-protocol/store@sha256:564323255704529e0cad7ed9b3c00b6d6716ebcb887117de04c0f4937f80cfec # :release, 2026-09 (pre-override)
  store:
    # `full` only — this is the one service built from a SIBLING CHECKOUT, and
    # keeping it out of `payments` is what lets a payments-only developer work
    # without STORE_CONTEXT existing at all (see Makefile).
    profiles: ['full']
    build:
      # The store sibling checkout (documented in README prerequisites; `make
      # up` preflights it — `make setup` only notes it, and `make up-payments`
      # never renders this service). Relative so the file stays portable.
      context: ../../store-gaps-worktree
      dockerfile: Dockerfile.store
    env_file:
      - conf/store.conf
    expose:
      - '3300' # paid job handler — PRIVATE, only store-connector dials this
    ports:
      - '3300:3400' # free health surface
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3400/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      # Same gate the retired turbo-tls shim had: uploads target this service.
      upload-service:
        condition: service_started
    restart: unless-stopped
    logging: *chain-logging

  # Gas station: kind:5096 (Solana — pays gas out of its fee-payer float) AND
  # kind:5098 (EVM — relays a client-signed ERC-2771 forward request through
  # the sandbox-deployed ERC2771Forwarder on anvil and pays the gas; see
  # contracts/DeploySandboxExtras.s.sol and conf/gas-station.conf). Handler
  # port 3300 UNPUBLISHED; free /describe + /health surface at host 3400.
  gas-station:
    profiles: ['full']
    image: ghcr.io/toon-protocol/gas-station@sha256:93429c3ad170dac358a58e0692037f2bd0071d5d53619c312afa80d359869cf4 # :release, 2026-09
    env_file:
      - conf/gas-station.conf
    expose:
      - '3300' # paid job handler — PRIVATE, only gas-connector dials this
    ports:
      - '3400:3400' # free /describe + /health
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3400/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      solana-validator:
        condition: service_healthy
      # kind:5098 transacts on anvil; healthy = forwarder + probe deployed.
      anvil:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # ── The Anyone credentials issuer stack ──────────────────────────────────
  # The fourth app behind the payment layer, and the first one that REFUSES TO
  # SERVE without proof of payment at the APP layer: the issuer will not blind-
  # sign a bundle without an Ed25519-signed X-Payment-Claim. Vendored, with its
  # comments' reasoning, from the anytoon sibling checkout's compose.yml.
  #
  # THE CHAIN:  anytoon-connector ──▶ claim-minter ──▶ issuer ──▶ postgres/redis
  #
  # TRUST BOUNDARY: the connector is the only ingress. The minter, the issuer
  # and their datastores publish NO host ports — exactly how the relay's write
  # port and the store's/gas station's handler ports are protected in this file
  # — and that unreachability is what authorises issuance: the minter does not,
  # and must not, check X-TOON-Amount (anytoon ADR 0001). (The anytoon repo
  # uses an `internal:` compose network for the same boundary; this file has no
  # networks at all, so "unpublished" is the sandbox's own idiom for it.)
  #
  # PRICE COUPLING — the hazard of this subsystem. THREE numbers must agree or
  # every paid request answers 402 CLAIM_INVALID: the connector route price
  # (conf/connector-anytoon.toml, base units), the minter's BUNDLE_PRICE and
  # the issuer's BUNDLE_PRICE (both decimals). The latter two are ONE FILE —
  # conf/anytoon.conf is the `env_file` of both services below, so they cannot
  # drift; the first is that decimal x 10^6, re-derived and asserted by
  # scripts/smoke-toon.mjs on every run.

  # One-shot: the issuer's epoch keyring + the minter/issuer Ed25519 proxy pair.
  #
  # Runs the UPSTREAM IMAGE'S OWN dev-key generator (`bun run keys:dev` ->
  # scripts/generate-dev-keys.ts), not a hand-rolled openssl script: the
  # current issuer wants a SIGNED KEYRING (config/keys/keyring.json — an
  # Ed25519 root key, an RSA-2048 epoch key, and a root_sig over the canonical
  # key document), which openssl alone cannot produce. Same image, different
  # command; nothing about the image is modified. Idempotent — the generator
  # returns early when all four files exist — except that an EXPIRED epoch is
  # re-forged, because the keyring lives in a named volume that outlives the
  # generator's 30-day epoch window and an expired epoch signs nothing.
  #
  # proxy.key.pem is a 0644 copy of the generator's 0600 proxy.pem, under the
  # filename the anytoon repo documents: the minter runs as uid `node` and
  # could not read the original. DEV KEY MATERIAL, valueless, like everything
  # else under keys/ here.
  issuer-keys:
    profiles: ['credentials', 'full']
    image: ghcr.io/anyone-protocol/credentials-issuer@sha256:50db4db55250508c52f7c31a24d73b1eaac92aa63b537bee2aedce7c616c1c42 # :latest, 2026-09-05
    restart: 'no'
    entrypoint:
      - sh
      - -c
      - |
        set -e
        bun run keys:dev
        bun -e 'const k = await Bun.file("config/keys/keyring.json").json();
                const e = k.epochs.find((x) => x.epoch_id === k.current_epoch);
                process.exit(Date.parse(e.not_after) > Date.now() + 86400000 ? 0 : 1)' \
          || bun scripts/generate-dev-keys.ts --force
        cp config/keys/proxy.pem config/keys/proxy.key.pem
        chmod 0644 config/keys/proxy.key.pem config/keys/proxy.pub.pem
    volumes:
      - anytoon-keys:/app/config/keys

  # The upstream issuer, UNMODIFIED. Pinned by digest (the `latest` tag is
  # mutable and this stack's env names track the image's config loader).
  issuer:
    profiles: ['credentials', 'full']
    image: ghcr.io/anyone-protocol/credentials-issuer@sha256:50db4db55250508c52f7c31a24d73b1eaac92aa63b537bee2aedce7c616c1c42 # :latest, 2026-09-05
    env_file:
      # BUNDLE_PRICE — shared verbatim with claim-minter. See the header above.
      - conf/anytoon.conf
    environment:
      NODE_ENV: production
      PORT: '3000'
      # No DB_SYNCHRONIZE: the schema comes from `issuer-migrate`, which runs
      # the image's own TypeORM migrations exactly once.
      POSTGRES_HOST: issuer-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      REDIS_HOST: issuer-redis
      REDIS_PORT: '6379'
      # The signed epoch keyring + the proxy's PUBLIC half. The issuer never
      # holds the proxy private key — that is the whole point of the pair.
      KEYRING_PATH: /keys/keyring.json
      PROXY_PUBLIC_KEY_PATH: /keys/proxy.pub.pem
      # A safety net, not a billing trap: a paid request answered 429 is money
      # for nothing, and payment is the real rate limiter here.
      RATE_LIMIT_MAX: '6000'
      RATE_LIMIT_WINDOW_SECONDS: '60'
    expose:
      - '3000' # UNPUBLISHED — only the connector's free keys route and the minter dial this
    volumes:
      - anytoon-keys:/keys:ro
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      issuer-keys:
        condition: service_completed_successfully
      issuer-migrate:
        condition: service_completed_successfully
      issuer-redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # Runs the schema migrations exactly once, then exits, so no issuer ever
  # races another to migrate.
  issuer-migrate:
    profiles: ['credentials', 'full']
    image: ghcr.io/anyone-protocol/credentials-issuer@sha256:50db4db55250508c52f7c31a24d73b1eaac92aa63b537bee2aedce7c616c1c42 # :latest, 2026-09-05
    restart: 'no'
    entrypoint: ['bun', 'run', 'migration:run']
    working_dir: /app/apps/backend
    environment:
      POSTGRES_HOST: issuer-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    depends_on:
      issuer-postgres:
        condition: service_healthy

  issuer-postgres:
    profiles: ['credentials', 'full']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - issuer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready talks to the
      # local socket and passes against the temporary server the image runs
      # during initdb, which does not listen on TCP — so `issuer-migrate`
      # starts and dies with ECONNREFUSED on a cold volume.
      #
      # The window is generous on purpose: a COLD volume runs initdb first, and
      # on a loaded dev box its shutdown checkpoint alone has been measured at
      # ~9s. A stack that comes up in seconds on an idle machine gave
      # "dependency failed to start: container ... is unhealthy" on a busy one.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U app -d app']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped
    logging: *chain-logging

  issuer-redis:
    profiles: ['credentials', 'full']
    image: redis:7-alpine
    volumes:
      - issuer-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *chain-logging

  # Turns the connector's statement of WHO PAID into the signed payment claim
  # the issuer requires, and does nothing else. It proxies POST /v1/bundles
  # only — its handler_url is its ROOT, so without that whitelist a caller
  # could reach any issuer path with a freshly minted claim attached.
  #
  # BUILT from the anytoon sibling checkout, the same pattern the `store` image
  # uses: relative default (`../../anytoon`), overridable with ANYTOON_CONTEXT
  # (exported by the Makefile) if your checkout lives elsewhere. There is no
  # published image for it.
  claim-minter:
    profiles: ['credentials', 'full']
    build:
      context: ${ANYTOON_CONTEXT:-../../anytoon}/claim-minter
    env_file:
      # BUNDLE_PRICE — the SAME FILE the issuer reads. See the header above.
      - conf/anytoon.conf
    environment:
      PORT: '8080'
      ISSUER_URL: http://issuer:3000
      PROXY_PRIVATE_KEY_PATH: /keys/proxy.key.pem
      # Signed into every claim; the issuer records it but does not check it.
      ROUTE_ID: g.anyone.credentials
    expose:
      - '8080' # UNPUBLISHED — only anytoon-connector dials this
    volumes:
      - anytoon-keys:/keys:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      issuer:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # ── The connectors ───────────────────────────────────────────────────────
  # Stock image on the same immutable pin the relay/store/gas-station deploy
  # bundles carry (rust-2026.08.28.1). No environment layer — every value
  # comes from the mounted toml; startup is FAIL-CLOSED. The healthcheck's
  # GET /ilp/identity answers 200 only once the config loaded AND both
  # settlement backends connected (127.0.0.1, never localhost: the listener
  # binds IPv4 only and busybox wget resolves ::1 first).

  store-connector:
    profiles: ['full']
    image: ghcr.io/toon-protocol/connector@sha256:a41f5a8e6b120ebc62430675741f8afc37267561c377abb39446691b470e79ec # rust-sha-f278cd6, 2026-09
    command: ['/app/config/connector.toml']
    volumes:
      - ./conf/connector-store.toml:/app/config/connector.toml:ro
      - ./keys/toon/store-connector:/app/data:ro
      - store-connector-state:/app/state
    ports:
      - '3210:3000'
    healthcheck: &connector-healthcheck
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      anvil:
        condition: service_healthy
      solana-validator:
        condition: service_healthy
      seed-toon-evm:
        condition: service_completed_successfully
      seed-toon-solana:
        condition: service_completed_successfully
      store:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  gas-connector:
    profiles: ['full']
    image: ghcr.io/toon-protocol/connector@sha256:a41f5a8e6b120ebc62430675741f8afc37267561c377abb39446691b470e79ec # rust-sha-f278cd6, 2026-09
    command: ['/app/config/connector.toml']
    volumes:
      - ./conf/connector-gas.toml:/app/config/connector.toml:ro
      - ./keys/toon/gas-connector:/app/data:ro
      - gas-connector-state:/app/state
    ports:
      - '3220:3000'
    healthcheck: *connector-healthcheck
    depends_on:
      anvil:
        condition: service_healthy
      solana-validator:
        condition: service_healthy
      seed-toon-evm:
        condition: service_completed_successfully
      seed-toon-solana:
        condition: service_completed_successfully
      gas-station:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  anytoon-connector:
    profiles: ['credentials', 'full']
    image: ghcr.io/toon-protocol/connector@sha256:a41f5a8e6b120ebc62430675741f8afc37267561c377abb39446691b470e79ec # rust-sha-f278cd6, 2026-09
    command: ['/app/config/connector.toml']
    volumes:
      # THE CONFIG FILE IS A VARIABLE, and the default is the committed one —
      # so `make up`, `make up-payments` and a bare `docker compose config`
      # render exactly what they always did.
      #
      # `make up-hs` is the only thing that overrides it, with the RENDERED
      # config scripts/hs-address.sh writes (conf/.rendered/connector-anytoon.toml
      # = this file with its [node] endpoints pointed at the daemon's `.anyone`
      # address). It has to be a different FILE rather than an edit in place,
      # because the committed one is a source of truth and the address is
      # generated: it changes on any cold start that wipes the anon volume.
      #
      # WHY THE ENDPOINT MATTERS AT ALL: a client dials the URL the node
      # PUBLISHES at GET /ilp, not the one the caller typed
      # (ToonClient.transportFor -> selectTransport). A node fronted by a hidden
      # service that still advertises http://127.0.0.1:3230/ilp sends every
      # buyer's packet at the buyer's own loopback through the SOCKS proxy. And
      # a relative endpoint is not the way out: this connector refuses one at
      # load ("[node] http_endpoint '/ilp' is not a URL: relative URL without a
      # base").
      - ${ANYTOON_CONNECTOR_CONF:-./conf/connector-anytoon.toml}:/app/config/connector.toml:ro
      - ./keys/toon/anytoon-connector:/app/data:ro
      - anytoon-connector-state:/app/state
    ports:
      - '3230:3000'
    healthcheck: *connector-healthcheck
    depends_on:
      anvil:
        condition: service_healthy
      solana-validator:
        condition: service_healthy
      seed-toon-evm:
        condition: service_completed_successfully
      seed-toon-solana:
        condition: service_completed_successfully
      # Both terminated routes' handlers: the paid one goes through the minter,
      # the free keys one straight at the issuer.
      claim-minter:
        condition: service_healthy
      issuer:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # ── The compute provider (TOON_Network Milestone 1) ──────────────────────
  # `toon-provider`, built from the provider sibling checkout: a tenant pays
  # `g.toon.provider.basic.v1.spawn` and gets a running container reachable
  # over SSH with its own key. The app is a plain HTTP app behind ITS OWN
  # connector (README §5 Level 2, copied from the store-connector shape); it
  # reads no X-TOON-* header, so it takes the peer role.
  #
  # THE DOCKER SOCKET IS MOUNTED, and that is the whole deployment shape: the
  # provider shells out to the docker CLI, so its workloads run as siblings
  # on the HOST daemon (named toon-<id>), their SSH forwards and ports are
  # published on the host, and conf/provider.toml's public_ip is 127.0.0.1
  # from the host's point of view. The image is pulled by the daemon by
  # reference@digest. Handler port 8080 is UNPUBLISHED, like every other
  # app's paid port here — only provider-connector dials it.
  provider:
    profiles: ['payments', 'full']
    build:
      # The provider sibling checkout (toon-protocol/provider). Relative so
      # the file stays portable; only `payments` and `full` render it.
      context: ${PROVIDER_CONTEXT:-../../provider}
    volumes:
      - ./conf/provider.toml:/etc/toon-provider/provider.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The lease table: the only record that a lease exists. A named volume
      # so a `docker compose restart provider` strands nothing.
      - provider-state:/var/lib/toon-provider
    expose:
      - '8080' # PRIVATE, only provider-connector dials this
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    logging: *chain-logging

  # The provider's payer for RELAY WRITES (TOON_Network #6). The provider's
  # Profile, Listings and Liveness are paid packets on g.toon.relay (ADR 0007
  # — never the free g.toon.relay.ephemeral lane, whose rate limit is keyed by
  # remote address and so shared by everyone behind one connector). Paying one
  # means holding a payment channel, signing a balance proof per packet and
  # sealing to the terminating connector; @toon-protocol/client is the proven
  # implementation of that and is not a Rust crate, so `toon-provider` states
  # WHAT to publish and this sidecar decides HOW it is paid for. The provider's
  # Nostr key never reaches it: it holds money, not identity.
  #
  # It pays through the HUB's client edge, exactly as scripts/smoke-toon.mjs's
  # buyer does — a client channel, not a peering — on ACCOUNT INDEX 1 of the
  # same committed test phrase so it holds its own wallet and its own channel.
  # Two payers sharing one channel share one nonce watermark and the loser of
  # that race has every later claim refused.
  directory-publisher:
    profiles: ['payments', 'full']
    build:
      context: ${PROVIDER_CONTEXT:-../../provider}
      dockerfile: tools/publisher/Dockerfile
    environment:
      TOON_CONNECTOR_URL: http://relay-connector:3000
      TOON_CHAIN: solana
      TOON_RPC_URL: http://solana-validator:8899
      # anvil's published test phrase, like every other key here.
      TOON_MNEMONIC: 'test test test test test test test test test test test junk'
      TOON_ACCOUNT_INDEX: '1'
      TOON_DEPOSIT: '10000000' # 10 mock USDC at 6 dp; a write costs 1 unit
      TOON_CHANNEL_STORE: /var/lib/toon-publisher/channels.json
      # Relay READ url (what conf/provider.toml publishes) -> the PAID ILP
      # destination that writes to it (conf/connector-relay.toml, price 1).
      RELAY_WRITE_ROUTES: '{"ws://relay:7100":"g.toon.relay"}'
      # A client dials the endpoint a node's SELF-DESCRIPTION advertises, not
      # the URL it was configured with. This hub advertises
      # http://127.0.0.1:3200/ilp so the HOST-run smokes can reach it; a
      # container on this network reaches the same node at relay-connector:3000.
      # Sandbox-only: in production the advertised endpoint is the real one.
      TOON_ENDPOINT_REWRITE: '{"http://127.0.0.1:3200":"http://relay-connector:3000"}'
    volumes:
      # The channel watermark. A named volume so a restart keeps it, and
      # `make clean` wipes it with the chain — a watermark that outlives its
      # validator refuses every later claim.
      - directory-publisher-state:/var/lib/toon-publisher
    expose:
      - '8081' # PRIVATE, only the provider dials this
    depends_on:
      solana-validator:
        condition: service_healthy
      seed-toon-solana:
        condition: service_completed_successfully
      relay-connector:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  provider-connector:
    profiles: ['payments', 'full']
    image: ghcr.io/toon-protocol/connector@sha256:a41f5a8e6b120ebc62430675741f8afc37267561c377abb39446691b470e79ec # rust-sha-f278cd6, 2026-09
    command: ['/app/config/connector.toml']
    volumes:
      - ./conf/connector-provider.toml:/app/config/connector.toml:ro
      - ./keys/toon/provider-connector:/app/data:ro
      - provider-connector-state:/app/state
    ports:
      - '3240:3000'
    healthcheck: *connector-healthcheck
    depends_on:
      anvil:
        condition: service_healthy
      solana-validator:
        condition: service_healthy
      seed-toon-evm:
        condition: service_completed_successfully
      seed-toon-solana:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # ── THE SECOND PROVIDER (TOON_Network #34, Milestone 3) ──────────────────
  # A Standby Set has to span two PROVIDERS — a Warm Standby bought from the
  # provider that already runs the primary is no standby at all (spec §7) — so
  # the sandbox runs a second one, whole: its own Nostr identity
  # (conf/provider2.toml), its own connector on its own client edge, its own
  # peering channel with the hub, its own directory publisher on its own
  # wallet, and its own lease table. The ONE thing it shares with the first
  # provider is this host's Docker daemon, which a real second provider would
  # not: hence the disjoint workload id, SSH and port ranges in its config
  # (ids 1100-1199, SSH 43000-43099, port blocks 44000-45599), so the two
  # never fight over a container name or a host port.
  #
  # Same image, same build context as `provider` — one checkout, two configs.
  provider2:
    profiles: ['payments', 'full']
    build:
      context: ${PROVIDER_CONTEXT:-../../provider}
    volumes:
      - ./conf/provider2.toml:/etc/toon-provider/provider.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Its OWN lease table: two providers sharing one would be one provider.
      - provider2-state:/var/lib/toon-provider
    expose:
      - '8080' # PRIVATE, only provider2-connector dials this
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    logging: *chain-logging

  # The SECOND provider's payer for relay writes. Everything the
  # `directory-publisher` service's header says applies here; the one field
  # that matters is TOON_ACCOUNT_INDEX. Two publishers on one account would be
  # two processes on one channel, and two processes on one channel share one
  # nonce watermark — the loser of that race has every later claim refused, so
  # the second provider's publisher pays from ACCOUNT INDEX 2 of the same
  # committed test phrase, with its own wallet, its own channel and its own
  # watermark volume. scripts/seed-toon-solana.mjs funds it by address.
  directory-publisher2:
    profiles: ['payments', 'full']
    build:
      context: ${PROVIDER_CONTEXT:-../../provider}
      dockerfile: tools/publisher/Dockerfile
    environment:
      TOON_CONNECTOR_URL: http://relay-connector:3000
      TOON_CHAIN: solana
      TOON_RPC_URL: http://solana-validator:8899
      TOON_MNEMONIC: 'test test test test test test test test test test test junk'
      TOON_ACCOUNT_INDEX: '2'
      TOON_DEPOSIT: '10000000' # 10 mock USDC at 6 dp; a write costs 1 unit
      TOON_CHANNEL_STORE: /var/lib/toon-publisher/channels.json
      RELAY_WRITE_ROUTES: '{"ws://relay:7100":"g.toon.relay"}'
      TOON_ENDPOINT_REWRITE: '{"http://127.0.0.1:3200":"http://relay-connector:3000"}'
    volumes:
      - directory-publisher2-state:/var/lib/toon-publisher
    expose:
      - '8081' # PRIVATE, only provider2 dials this
    depends_on:
      solana-validator:
        condition: service_healthy
      seed-toon-solana:
        condition: service_completed_successfully
      relay-connector:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # The second provider's connector: same pinned image as every other node
  # here, the next free client-edge port (3250), its own key directory and its
  # own state volume. It terminates g.toon.provider2.* — including the
  # `.standby` and `.standby.extend` rows conf/provider2.toml's `warm` tier
  # prices (spec §7) — and accepts the relay-provider2 peering.
  provider2-connector:
    profiles: ['payments', 'full']
    image: ghcr.io/toon-protocol/connector@sha256:a41f5a8e6b120ebc62430675741f8afc37267561c377abb39446691b470e79ec # rust-sha-f278cd6, 2026-09
    command: ['/app/config/connector.toml']
    volumes:
      - ./conf/connector-provider2.toml:/app/config/connector.toml:ro
      - ./keys/toon/provider2-connector:/app/data:ro
      - provider2-connector-state:/app/state
    ports:
      - '3250:3000'
    healthcheck: *connector-healthcheck
    depends_on:
      anvil:
        condition: service_healthy
      solana-validator:
        condition: service_healthy
      seed-toon-evm:
        condition: service_completed_successfully
      seed-toon-solana:
        condition: service_completed_successfully
      provider2:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # The hub. Starts after all three accepting peers are healthy (it dials them; a
  # peering whose far side is not serving answers T01 rather than failing
  # loudly, so bring-up order matters for a deterministic first smoke).
  relay-connector:
    profiles: ['payments', 'credentials', 'full']
    image: ghcr.io/toon-protocol/connector@sha256:a41f5a8e6b120ebc62430675741f8afc37267561c377abb39446691b470e79ec # rust-sha-f278cd6, 2026-09
    command: ['/app/config/connector.toml']
    volumes:
      - ./conf/connector-relay.toml:/app/config/connector.toml:ro
      - ./keys/toon/relay-connector:/app/data:ro
      - relay-connector-state:/app/state
    ports:
      - '3200:3000'
    healthcheck: *connector-healthcheck
    depends_on:
      anvil:
        condition: service_healthy
      solana-validator:
        condition: service_healthy
      seed-toon-evm:
        condition: service_completed_successfully
      seed-toon-solana:
        condition: service_completed_successfully
      relay:
        condition: service_healthy
      # `required: false` ONLY so the `payments` and `credentials` profiles
      # render: a depends_on naming a service the active profiles disable is a
      # hard config error ("depends on undefined service"), and required:false
      # downgrades that to a warning. A peer that IS enabled still gates as
      # written — under `full` the hub starts only after all three accepting
      # peers are healthy, under `credentials` only after anytoon-connector is.
      store-connector:
        condition: service_healthy
        required: false
      gas-connector:
        condition: service_healthy
        required: false
      anytoon-connector:
        condition: service_healthy
        required: false
      # On `payments` and `full`; `credentials` leaves it out, hence the
      # same required:false downgrade as the three above.
      provider-connector:
        condition: service_healthy
        required: false
      provider2-connector:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *chain-logging

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # The Workload Gateway — profile `gateway` (`make up-gateway`)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # TOON_Network ADR 0013, spec §12; Milestone 5 (#46, #53) and Milestone 6
  # (#56, #62). A workload is reachable today only at whichever provider runs
  # it, on a host and port that provider chose, and a Hidden Provider gives no
  # host at all; a Takeover moves it. The Workload Gateway is the party that
  # owns the stable name: it serves `<canonical label>.gw.localhost` — the
  # label derived from the workload id and from nothing else — and forwards to
  # the running member of the workload's Standby Set, which it finds by sending
  # each member a plain `status` presenting the tenant's GATEWAY GRANT: a value
  # derived from that member's Continuation Token, which the tenant derives in
  # turn from the lease's root secret (spec §6.1.1, §6.5.1) — not an event.
  #
  # HOW IT IS TOLD WHAT TO SERVE: one sealed packet. The tenant seals a
  # Gateway Handover to the connector below (scripts/handover.mjs is the one
  # command), the connector unseals it and forwards plain JSON to
  # GATEWAY_HANDOVER_PORT, and the gateway admits it by asking the members
  # whether the grant works (spec §12.1). NOTHING IS PUBLISHED and the gateway
  # reads no relay for it; a Gateway Withdrawal, over the same route, takes
  # the workload off again (§12.7). It has no key of its own any more.
  #
  # NOT the AR.IO gateway (`envoy`/`core`, the permaweb half): CONTEXT.md keeps
  # the two apart, so nothing here is called "gateway" unqualified.
  #
  # IT HOLDS NO LEASE AND PAYS NOTHING. No channel, no mnemonic, no seed job
  # funds it, and it calls no paid route: `status` is free, a relay read is
  # free, and the grant is its whole authority. Its own connector below
  # terminates the handover route FREE (#46 still defers the price) — the
  # shape is here, the price is not.
  #
  # ONE THING ABOUT THIS SANDBOX, and only this sandbox, is in
  # conf/workload-gateway.conf's GATEWAY_DIAL_REWRITE: a running member's
  # access.host is 127.0.0.1, the HOST daemon the workloads publish on, which
  # from inside this container is dialled at host.docker.internal. That conf
  # file says why at length. A MEMBER is reached where its own Profile says it
  # is, here as in a deployment: the gateway seals `status` through the
  # member's connector (TOON_Network#114), and every connector on this network
  # answers at exactly the name its Profile advertises.
  workload-gateway:
    profiles: ['gateway']
    build:
      # The gateway sibling checkout (toon-protocol/gateway). Relative so the
      # file stays portable; only `gateway` renders it.
      context: ${GATEWAY_CONTEXT:-../../gateway}
    env_file:
      # ONE file, and the hidden path needs no second one: a hidden member's
      # connector is reached at the `.anyone` address its Profile advertises,
      # through TOON_SOCKS_PROXY, which is the same rule as for any other
      # member (TOON_Network#114). scripts/hs-provider-address.sh used to
      # render a per-provider rewrite here and no longer does.
      - conf/workload-gateway.conf
    volumes:
      # The self-signed wildcard certificate for *.gw.localhost and its key —
      # committed dev material, like everything under conf/ and keys/. Read
      # once at startup.
      - ./conf/workload-gateway-tls:/etc/workload-gateway/tls:ro
    ports:
      - '3280:8080' # plain HTTP: `curl http://<label>.gw.localhost:3280/`
      - '3443:8443' # HTTPS with the dev certificate: `curl --cacert conf/workload-gateway-tls/gw.localhost.crt https://<label>.gw.localhost:3443/`
      # NOT 8081, GATEWAY_HANDOVER_PORT: a handover reaches it only through
      # workload-gateway-connector, on the compose network, unsealed. A host
      # port here would be a way to tell the gateway something without paying
      # its connector a packet, which is not a path this sandbox rehearses.
    extra_hosts:
      # Where GATEWAY_DIAL_REWRITE sends a member's 127.0.0.1: this host, as
      # the daemon publishes the workloads' ports on it.
      - 'host.docker.internal:host-gateway'
    networks:
      default: {}
      # The buyer's SOCKS proxy (`anon-client`, `hs` only) lives on this network
      # and nowhere else; TOON_SOCKS_PROXY names it, and the gateway dials it
      # for every `.anyone` host (TOON_Network #52). Joining it under
      # `make up-gateway` alone creates an empty network and dials nothing.
      hs-payer: {}
    healthcheck:
      # The gateway answers a hostname it holds no grant for — `127.0.0.1` is
      # one — with its own 503 and dials nothing (spec §12.3): a liveness probe
      # that touches no provider. node:22-slim has no curl.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.status === 503 && r.headers.get('toon-gateway-reason') === 'no_grant' ? 0 : 1), () => process.exit(1))"]
      # 15 s, not the 5 s the rest of this file uses: the probe is a node
      # process, and each probe is a line in the gateway's request log.
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5s
    depends_on:
      # `required: false` for the reason the connector below carries it, and
      # the hub's chain gates before that: `gateway` alone disables `relay`,
      # and a depends_on naming a disabled service renders NOTHING — which
      # made `docker compose --profile gateway logs workload-gateway`, a
      # command README §2 tells you to run, answer "invalid compose project".
      # Every real run brings this profile up on top of `full` or `payments`,
      # both of which enable the relay, so the gate holds as written.
      relay:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *chain-logging

  # The gateway's OWN connector (ADR 0013): the next free client edge, 3260,
  # its own key directory and its own state volume. It terminates ONE route,
  # free — `g.toon.workload-gateway.handover`, the sealed Gateway Handover and
  # Withdrawal, forwarded to the gateway's GATEWAY_HANDOVER_PORT at the path
  # its door serves — and settles on Solana so that a tenant can open a
  # channel against it and pay it DIRECTLY at :3260 (scripts/handover.mjs;
  # conf/connector-workload-gateway.toml says why direct and why Solana only).
  # It is still the one connector here the hub does not peer with. It starts
  # after the gateway is healthy for the same reason the provider connectors
  # start after their apps, and after the chain and its seed for the same
  # reason they do: a connector whose settlement key holds no SOL refuses to
  # boot, and scripts/seed-toon-solana.mjs is what funds it.
  workload-gateway-connector:
    profiles: ['gateway']
    image: ghcr.io/toon-protocol/connector@sha256:a41f5a8e6b120ebc62430675741f8afc37267561c377abb39446691b470e79ec # rust-sha-f278cd6, 2026-09
    command: ['/app/config/connector.toml']
    volumes:
      - ./conf/connector-workload-gateway.toml:/app/config/connector.toml:ro
      - ./keys/toon/workload-gateway-connector:/app/data:ro
      - workload-gateway-connector-state:/app/state
    ports:
      - '3260:3000'
    healthcheck: *connector-healthcheck
    depends_on:
      # `required: false` for the reason the hub's chain gates carry it: a
      # depends_on naming a service the ACTIVE profiles disable is a hard
      # config error that renders nothing at all, and `gateway` alone disables
      # both of these — which is what `docker compose --profile gateway logs
      # workload-gateway` (README §2) and the hidden recipe's `--profile hs
      # --profile gateway` select. This profile is never brought up on its own
      # (`make up-gateway` is `full`-or-`payments` PLUS `gateway`, and both of
      # those enable the chain and its seed), so under every real run these
      # gate exactly as written.
      solana-validator:
        condition: service_healthy
        required: false
      seed-toon-solana:
        condition: service_completed_successfully
        required: false
      workload-gateway:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # The hidden-service ingress — profile `hs` ONLY (`make up-hs`)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Everything below rehearses the one production shape the rest of this file
  # cannot: a node whose ONLY ingress is a `.anyone` hidden service, which is
  # how the anytoon credentials issuer actually deploys. The buyer dials an
  # address no DNS resolves, through a SOCKS5h proxy, and its chain RPC rides
  # the same circuit.
  #
  # OPT-IN, AND NEVER IN `make up`. There is no local Anyone directory
  # authority: `anon` bootstraps against the real network, so every target here
  # takes a third-party dependency. `make smoke-hs` is a rehearsal, not a gate —
  # it can fail because the relay network had a bad day, and its output says so
  # in those words. Two precedents in this org draw the same line: anytoon
  # splits `make hs-e2e` out of `make local-e2e`, and the connector repo keeps
  # its hidden-service rehearsals off CI.
  #
  # NOTHING IN `full` DEPENDS ON THESE, in either direction — no service outside
  # this section names one, and `make up` renders none of them. What DOES change
  # under `hs` is what the anytoon node ADVERTISES: `make up-hs` recreates it
  # against the rendered config, so its self-description names the `.anyone`
  # address instead of http://127.0.0.1:3230/ilp. That is the production shape
  # (the circuit is the ingress), and it is load-bearing rather than cosmetic —
  # a client dials what a node publishes. Consequences, stated plainly:
  #   - the HUB is unaffected: it dials the endpoint its own [[peers]] row
  #     names (http://anytoon-connector:3000/ilp), so hub-routed purchases still
  #     work exactly as they did.
  #   - a CLEARNET client pointed straight at localhost:3230 no longer can be:
  #     the endpoint it is handed is a hidden service and it has no proxy, which
  #     @toon-protocol/client refuses by name. That is `make smoke` step 4c's
  #     free-route half. Run `make smoke` against `make up`, `make smoke-hs`
  #     against `make up-hs`; they are two rehearsals of the same node, not one
  #     suite split in two.

  # The TCP forwarder the daemon's loopback ports lead to, and the owner of the
  # network namespace the daemon shares.
  #
  # WHY IT EXISTS. `anon` resolves a HiddenServicePort target when it PARSES its
  # config — before any stream arrives, and before the connector it fronts can
  # possibly exist, because that connector's own config has to name an address
  # only this daemon can generate. anytoon breaks that circle with a pinned
  # subnet and a fixed container IP (compose.yml there, `edge` + 172.31.0.10).
  # This sandbox breaks it with a shared loopback instead: conf/anonrc names
  # 127.0.0.1, which always parses, and `socat` here resolves `anytoon-connector`
  # and `anvil` BY NAME once per connection. The gain is that no existing
  # service acquires a fixed IP, this project needs no pinned subnet to collide
  # with someone else's, and `make up-hs` can recreate the connector (it must —
  # rendered config) without leaving the daemon pointed at a dead address.
  #
  # Same image as `anon` — it carries socat for exactly this (see anon/Dockerfile)
  # — so the profile builds one image and pulls no second one.
  hs-ingress:
    profiles: ['hs']
    build:
      context: ./anon
    image: toon-sandbox-anon:v0.4.10.2
    init: true
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        # 3000 -> the anytoon-connector's client edge (the issuer path).
        socat -d TCP-LISTEN:3000,bind=127.0.0.1,fork,reuseaddr TCP:anytoon-connector:3000 &
        # 8545 -> anvil, for the buyer's proxied chain RPC.
        socat -d TCP-LISTEN:8545,bind=127.0.0.1,fork,reuseaddr TCP:anvil:8545 &
        # 3200 -> the hub's client edge and 7100 -> the relay's websocket, for
        # THE HIDDEN PROVIDER (TOON_Network #43). It reaches both over the
        # overlay because `anon` builds no circuit to a private address, and
        # they are on THIS daemon's address rather than its own because a daemon
        # dialling its own hidden service is the one overlay path that does not
        # reliably build. conf/anonrc says it at length.
        socat -d TCP-LISTEN:3200,bind=127.0.0.1,fork,reuseaddr TCP:relay-connector:3000 &
        socat -d TCP-LISTEN:7100,bind=127.0.0.1,fork,reuseaddr TCP:relay:7100 &
        wait
    restart: unless-stopped
    logging: *chain-logging

  # The daemon that gives the anytoon issuer path its address: it generates the
  # `.anyone` address, publishes a descriptor for it on the real network, and
  # forwards what arrives to the two loopback ports above. Config: conf/anonrc.
  #
  # BUILT, NOT PULLED: ghcr publishes no image past v0.4.9.7, whose `.onion` TLD
  # every current client refuses by name. See anon/Dockerfile — it is the
  # anytoon checkout's anon-image pattern, sha256-verified.
  #
  # NO `depends_on` ON THE CONNECTOR, deliberately (anytoon's compose.yml makes
  # the same point). The connector does not need this daemon in order to serve;
  # it needs it in order to be REACHED, which is a different claim and one
  # compose cannot express. `make up-hs` orders them: this daemon first, because
  # its address has to exist before the connector's config can be rendered.
  anon:
    profiles: ['hs']
    build:
      context: ./anon
    image: toon-sandbox-anon:v0.4.10.2
    init: true
    # Shares hs-ingress's network stack, which is what makes `127.0.0.1` in
    # conf/anonrc mean "the forwarder". A service in this mode cannot declare
    # `networks:` — it has hs-ingress's, i.e. the project default, which is also
    # where its outbound route to the Anyone network comes from.
    network_mode: 'service:hs-ingress'
    depends_on:
      hs-ingress:
        condition: service_started
    volumes:
      - ./conf/anonrc:/etc/anon/anonrc:ro
      # A NAMED VOLUME: it holds hidden_service/hostname and the private key
      # behind this address. `make down` keeps it, so the address survives a
      # restart; `make clean` wipes it with everything else and the next cold
      # start publishes a NEW address, which in a sandbox is expected rather
      # than a fault. In a deployment losing it is expensive and silent — see
      # conf/anonrc.
      - anon-data:/var/lib/anon
    restart: unless-stopped
    logging: *chain-logging
    healthcheck:
      # BOTH halves, and neither alone is enough. The hostname file appears at
      # key generation, seconds in and long before the descriptor is published;
      # `Bootstrapped 100%` is what says the daemon can actually publish it. A
      # container that is Up is not a container that has a circuit.
      test:
        - 'CMD-SHELL'
        - "test -s /var/lib/anon/hidden_service/hostname && grep -q 'Bootstrapped 100%' /var/lib/anon/notice.log"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # The buyer's way in: a SOCKS5 proxy and nothing else, on the host's loopback.
  # `make smoke-hs` names it as the TOON client's `socksProxy`, which carries
  # the packets AND (proxyRpc, on by default) the chain RPC.
  #
  # ON ITS OWN NETWORK, WITH NO ROUTE TO ANYTHING IN THIS PROJECT. A `.anyone`
  # name cannot be resolved by anything but the Anyone network, so a packet that
  # arrives at all arrived over a circuit; being unable to reach
  # `anytoon-connector` or `anvil` directly makes the shortcut impossible as
  # well as unused, which is what makes smoke-hs proof rather than assertion.
  anon-client:
    profiles: ['hs']
    build:
      context: ./anon
    image: toon-sandbox-anon:v0.4.10.2
    init: true
    volumes:
      - ./conf/anonrc-client:/etc/anon/anonrc:ro
      - anon-client-data:/var/lib/anon
    networks: [hs-payer]
    ports:
      # 19050, not 9050: an `anon` (or Tor) daemon on a developer's machine
      # already holds 9050 more often than not, and a second one is
      # "Bind for 127.0.0.1:9050 failed: port is already allocated" — which
      # stops the bring-up before anything is proved. Override with
      # ANON_SOCKS_PORT (the Makefile passes it to smoke-hs too).
      - '127.0.0.1:${ANON_SOCKS_PORT:-19050}:9050'
    restart: unless-stopped
    logging: *chain-logging
    healthcheck:
      test: ['CMD-SHELL', "grep -q 'Bootstrapped 100%' /var/lib/anon/notice.log"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # THE HIDDEN PROVIDER — profile `hs` ONLY (TOON_Network #43, spec §10)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # A THIRD provider (`g.toon.provider-hs`), whole and hidden: its own `anon`
  # daemon, its own connector, its own directory publisher, its own lease table
  # and its own workload id/port ranges. Nothing of it publishes a host port.
  # ADR 0008's five conditions, and where each one lives:
  #
  #   connector reachable only at .anyone   `anon-hs` + the rendered
  #                                         conf/.rendered/connector-provider-hs.toml
  #   every lease's ports likewise          created at runtime over the control
  #                                         port below (M4-3, #40)
  #   all workload egress through anon      `hs-egress`, whose gateway
  #                                         is this daemon (M4-4, #41)
  #   publishes no hostname or IP           `hidden = true`, no public_ip
  #   runs its own settlement RPC           `anvil`, on the private network
  #
  # WHAT IS AND IS NOT HIDDEN HERE, stated plainly. The connector, the per-lease
  # addresses, the workload egress, the provider's own outbound and the
  # settlement RPC all are. Two things are not, and both are sandbox facts
  # rather than protocol ones: a workload's IMAGE is pulled by the HOST's Docker
  # daemon, not by the provider, so a registry pull leaves from this host's
  # address; and `gateway_url_pattern` names `envoy`, a private service the
  # proxy cannot reach, so a TOON-store image cannot be fetched by this provider
  # at all. Neither is on the path of a lease spawned from a registry
  # reference.
  #
  # THE HUB DOES NOT PEER WITH IT, and that is not an omission: a tenant who
  # wants hidden compute opens a client channel against this connector's own
  # edge over the circuit (spec Appendix A). Nothing in `full` names anything
  # here, in either direction.

  # The forwarder the daemon's second virtual port leads to. Same circle
  # `hs-ingress` breaks, broken the same way: `anon` resolves a
  # HiddenServicePort target when it PARSES its config, so the target has to be
  # something that always parses — here a PINNED IP on `hs-provider` rather than
  # the shared loopback the anytoon daemon uses. This container then resolves
  # `anvil` BY NAME once per connection, so a recreated chain cannot leave the
  # daemon pointed at a dead address.
  #
  # The connector needs no such hop: it has a pinned address of its own below.
  # This exists for the chain alone, because `anvil` is a `full`-profile service
  # this profile must not modify. (The hub and the relay, which this provider
  # also reaches over the overlay, are published on the ANYTOON daemon's address
  # instead — see `hs-ingress` and conf/anonrc for why a daemon must not have to
  # dial its own hidden service.)
  hs-provider-ingress:
    profiles: ['hs']
    build:
      context: ./anon
    image: toon-sandbox-anon:v0.4.10.2
    init: true
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        # 8545 -> anvil, for a tenant's chain RPC over the SAME circuit it pays
        # the hidden provider on (toon-client ADR 0002: proxyRpc is on by
        # default, and reading chain state on clearnet while paying over a
        # circuit broadcasts the payer's settlement address from its own IP).
        socat -d TCP-LISTEN:8545,bind=172.30.1.4,fork,reuseaddr TCP:anvil:8545 &
        wait
    networks:
      default: {}
      hs-provider:
        ipv4_address: 172.30.1.4
    restart: unless-stopped
    logging: *chain-logging

  # THE HIDDEN PROVIDER'S OWN `anon` DAEMON. Config: conf/anonrc-hs, which
  # explains each of its three jobs at length — an address for the connector, a
  # cookie-authenticated control port for per-lease addresses, and a
  # SOCKS + transparent-proxy egress.
  #
  # IT IS ON THREE NETWORKS, and each one is a different job:
  #   default      its own route to the REAL Anyone network, and nothing else
  #                is bound there.
  #   hs-provider  pinned, and every surface this daemon offers the provider is
  #                on it: the ControlPort and the SocksPort bind 172.30.1.2,
  #                and conf/anonrc-hs names the connector (172.30.1.3) and the
  #                chain forwarder (172.30.1.4) as IP literals that always
  #                parse. Binding the two ports HERE rather than on 0.0.0.0 is
  #                the point — a workload shares the egress network with this
  #                daemon, and a control port it could dial would be a control
  #                port a tenant could dial.
  #   hs-egress    `internal: true`, pinned, and this daemon holds 10.203.0.2
  #                on it — the gateway, the resolver and the only way out for
  #                every hidden workload.
  #
  # NET_ADMIN AND AN ENTRYPOINT OF ITS OWN. A TransPort is reachable only
  # through nat/PREROUTING REDIRECT rules, and they must exist before the daemon
  # drops to `anond` and before any workload runs — so the container installs
  # them as root and then execs the image's own entrypoint unchanged. The rules
  # match on the SOURCE SUBNET rather than an interface name, because the
  # interface a compose network lands on is not stable.
  #
  # NO host port, here or anywhere below: the control port's whole reachable
  # surface is this project's networks, and it is cookie-authenticated on top.
  anon-hs:
    profiles: ['hs']
    build:
      context: ./anon
    image: toon-sandbox-anon:v0.4.10.2
    init: true
    cap_add:
      - NET_ADMIN
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        nat() { iptables -t nat -C PREROUTING "$$@" 2>/dev/null || iptables -t nat -A PREROUTING "$$@"; }
        inp() { iptables -C INPUT "$$@" 2>/dev/null || iptables -A INPUT "$$@"; }
        # DNS first, then the catch-all: a tcp/53 packet must reach the DNSPort,
        # not the TransPort, and -A appends in order. The catch-all excludes
        # traffic INSIDE the egress subnet, so two workloads on it still reach
        # each other directly rather than through a circuit that would refuse
        # them.
        nat -s 10.203.0.0/24 -p udp --dport 53 -j REDIRECT --to-ports 5353
        nat -s 10.203.0.0/24 -p tcp --dport 53 -j REDIRECT --to-ports 5353
        nat -s 10.203.0.0/24 ! -d 10.203.0.0/24 -p tcp --syn -j REDIRECT --to-ports 9040
        # AND THEN ONLY THOSE TWO PORTS. A workload shares this subnet with the
        # daemon, so without the DROP it could dial anything the daemon happens
        # to be listening on. The redirected packets arrive here already
        # rewritten to 9040/5353, which is why the ACCEPTs come first.
        inp -s 10.203.0.0/24 -p tcp --dport 9040 -j ACCEPT
        inp -s 10.203.0.0/24 -p tcp --dport 5353 -j ACCEPT
        inp -s 10.203.0.0/24 -p udp --dport 5353 -j ACCEPT
        inp -s 10.203.0.0/24 -j DROP
        exec docker-entrypoint anon -f /etc/anon/anonrc
    volumes:
      - ./conf/anonrc-hs:/etc/anon/anonrc:ro
      # This address and the PRIVATE KEY behind it. Survives `make down`, dies
      # with `make clean` — see conf/anonrc.
      - anon-hs-data:/var/lib/anon
      # THE CONTROL COOKIE, on a volume of its own so the provider can be given
      # the cookie WITHOUT being given the key beside it.
      - anon-hs-control:/var/lib/anon/control
    networks:
      default: {}
      hs-provider:
        ipv4_address: 172.30.1.2
      hs-egress:
        ipv4_address: 10.203.0.2
    restart: unless-stopped
    logging: *chain-logging
    healthcheck:
      # THREE halves, and none of them is enough alone. The hostname file
      # appears at key generation, seconds in; `Bootstrapped 100%` is what says
      # the descriptor can actually be published; the cookie is written when the
      # CONTROL PORT opens, which is the surface the provider needs.
      test:
        - 'CMD-SHELL'
        - "test -s /var/lib/anon/hidden_service/hostname && grep -q 'Bootstrapped 100%' /var/lib/anon/notice.log && test -s /var/lib/anon/control/control_auth_cookie"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # The hidden provider itself. Same image and build context as the other two
  # (one checkout, three configs), and the same deployment shape: it shells out
  # to the docker CLI, so its workloads run as siblings on the HOST daemon.
  #
  # ITS CONFIG IS THE RENDERED ONE. `hidden = true` refuses to start unless
  # `connector_url` is at an `.anyone` host, and that address exists only once
  # `anon-hs` has generated it — so `make up-hs` runs
  # scripts/hs-provider-address.sh and passes PROVIDER_HS_CONF. The default
  # below is the committed template, which loads (its placeholder is
  # valid-shaped) but advertises an address that resolves nowhere.
  provider-hs:
    profiles: ['hs']
    build:
      context: ${PROVIDER_CONTEXT:-../../provider}
    volumes:
      - ${PROVIDER_HS_CONF:-./conf/provider-hs.toml}:/etc/toon-provider/provider.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Its OWN lease table: three providers sharing one would be one provider.
      - provider-hs-state:/var/lib/toon-provider
      # READ-ONLY, and the cookie alone: this is how the provider authenticates
      # to 172.30.1.2:9051 to create and destroy a lease's `.anyone` address.
      - anon-hs-control:/var/lib/anon/control:ro
    networks:
      default: {}
      # Where the daemon's control and SOCKS ports are bound. No fixed address
      # of its own: it dials, it is not dialled here.
      hs-provider: {}
    expose:
      - '8080' # PRIVATE, only provider-hs-connector dials this
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      # A hidden provider with no daemon is not a hidden provider: it needs the
      # control port before it can answer a spawn at all.
      anon-hs:
        condition: service_healthy
      # AND ITS PUBLISHER, BEFORE ITSELF — which is not about publishing but
      # about DNS. A hidden provider dials its publisher DIRECTLY when the
      # publisher is on a private address and through `anon` when it is not,
      # and it decides which ONCE, at startup, by resolving `publish_url`
      # (`is_private_url`). A publisher that does not exist yet does not
      # resolve, so the provider would settle on "not private" and ask the
      # daemon for a circuit to `directory-publisher-hs` for the rest of its
      # life — SOCKS "host unreachable" on every Profile, Listing and
      # Liveness. Starting the publisher first is the whole fix.
      directory-publisher-hs:
        condition: service_started
    restart: unless-stopped
    logging: *chain-logging

  # The hidden provider's payer for relay writes. Everything the
  # `directory-publisher` service's header says applies here; the one field that
  # matters is TOON_ACCOUNT_INDEX — ACCOUNT 3, because index 1 and index 2 are
  # the other two publishers' and two processes on one channel share one nonce
  # watermark, whose loser has every later claim refused.
  # scripts/seed-toon-solana.mjs funds it by address.
  #
  # IT PAYS THE HUB OVER THE OVERLAY, like everything else this provider does
  # (spec §10 story 8: "Liveness and Directory writes leave through the same
  # anon route", so relay operators never see its address). What that means in a
  # sandbox with no clearnet is that the hub and the relay are published at
  # virtual ports of the ANYTOON daemon's address — see conf/anonrc — and this
  # payer dials them through `anon-hs`'s SOCKS port. Its chain RPC is the one
  # exception and stays direct: a private address is one no exit could reach and
  # one no packet crosses a watched network to get to.
  directory-publisher-hs:
    profiles: ['hs']
    build:
      context: ${PROVIDER_CONTEXT:-../../provider}
      dockerfile: tools/publisher/Dockerfile
    # THE THREE ENDPOINT VALUES COME FROM THE RENDERED FILE, not from here:
    # TOON_CONNECTOR_URL, TOON_ENDPOINT_REWRITE and RELAY_WRITE_ROUTES all name
    # the `.anyone` address `anon-hs` generated, which does not exist until it
    # has. scripts/hs-provider-address.sh writes them; `required: false` so
    # `--profile hs` alone still renders this file before they exist. A
    # `environment:` key would WIN over the file, which is why they are not
    # repeated below.
    env_file:
      - path: ./conf/.rendered/hs-provider.env
        required: false
    environment:
      TOON_CHAIN: solana
      # DIRECT, and by design: a private address is one no `anon` exit could
      # reach and one no packet crosses a watched network to get to, so the
      # publisher dials its chain RPC itself (tools/publisher/proxy.mjs,
      # `isNearUrl`). Everything else it dials rides the proxy.
      TOON_RPC_URL: http://solana-validator:8899
      TOON_MNEMONIC: 'test test test test test test test test test test test junk'
      TOON_ACCOUNT_INDEX: '3'
      TOON_DEPOSIT: '10000000' # 10 mock USDC at 6 dp; a write costs 1 unit
      TOON_CHANNEL_STORE: /var/lib/toon-publisher/channels.json
      # WITHOUT THESE TWO IT EXITS 1 (TOON_Network #42): a publisher beside a
      # hidden provider that dialled the hub from this host's real address
      # would leak exactly what the provider is hiding, so it refuses to start
      # rather than fail per request.
      TOON_HIDDEN: 'true'
      TOON_SOCKS_PROXY: socks5h://172.30.1.2:9050
    networks:
      default: {}
      hs-provider: {} # where the daemon's SOCKS port is bound
    volumes:
      - directory-publisher-hs-state:/var/lib/toon-publisher
    expose:
      - '8081' # PRIVATE, only provider-hs dials this
    depends_on:
      # `required: false` on every row naming a `full` service, and ONLY for
      # that reason: `--profile hs` alone (scripts/hs-address.sh runs it) must
      # still render this file, and a depends_on naming a service the active
      # profiles disable is otherwise a hard config error. Under `make up-hs`
      # (= full + hs) each row gates exactly as written.
      solana-validator:
        condition: service_healthy
        required: false
      seed-toon-solana:
        condition: service_completed_successfully
        required: false
      relay-connector:
        condition: service_healthy
        required: false
      # Its SOCKS proxy, and the daemon that publishes the addresses its
      # endpoints name: neither exists before this is healthy.
      anon-hs:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

  # The hidden provider's connector: same pinned image as every other node here,
  # its own key directory, its own state volume — and NO `ports:` line, which is
  # the whole point. It is reachable at exactly one address, over a circuit.
  #
  # PINNED AT 172.30.1.3 on `hs-provider` so conf/anonrc-hs can name it as an IP
  # literal (see `hs-provider-ingress` for why a name cannot be used), and so
  # recreating it against the rendered config — which `make up-hs` must do —
  # cannot leave the daemon pointed at a dead address.
  provider-hs-connector:
    profiles: ['hs']
    image: ghcr.io/toon-protocol/connector@sha256:a41f5a8e6b120ebc62430675741f8afc37267561c377abb39446691b470e79ec # rust-sha-f278cd6, 2026-09
    command: ['/app/config/connector.toml']
    volumes:
      - ${PROVIDER_HS_CONNECTOR_CONF:-./conf/connector-provider-hs.toml}:/app/config/connector.toml:ro
      - ./keys/toon/provider-hs-connector:/app/data:ro
      - provider-hs-connector-state:/app/state
    networks:
      default: {}
      hs-provider:
        ipv4_address: 172.30.1.3
    healthcheck: *connector-healthcheck
    depends_on:
      # `required: false` on the `full` rows — see `directory-publisher-hs`.
      anvil:
        condition: service_healthy
        required: false
      solana-validator:
        condition: service_healthy
        required: false
      seed-toon-evm:
        condition: service_completed_successfully
        required: false
      seed-toon-solana:
        condition: service_completed_successfully
        required: false
      provider-hs:
        condition: service_healthy
    restart: unless-stopped
    logging: *chain-logging

networks:
  # The buyer's proxy, and nothing else — see `anon-client`. Rendered under the
  # `hs` profile, and under `gateway`, whose Workload Gateway is a buyer-side
  # client of `.anyone` addresses too; `make up` creates no such network.
  hs-payer:

  # THE HIDDEN PROVIDER'S TWO NETWORKS (TOON_Network #43). Both are `hs`-only,
  # so `make up` creates neither, and both are PINNED — the one thing the rest
  # of this file deliberately avoids (see `hs-ingress`), because here a fixed
  # address is the mechanism rather than a convenience: a HiddenServicePort
  # target must parse before the container it names exists, and a workload's
  # gateway must be an IP the provider can write into a config.
  #
  # 10.203.0.0/24 is off Docker's default pool entirely and 172.30.1.0/24 sits
  # at its top; a collision with another project shows up as "Pool overlaps
  # with other one on this address space" at `make up-hs`, and the fix is to
  # move the subnet and every address that names it (conf/anonrc-hs,
  # conf/provider-hs.toml and the services above).
  hs-egress:
    # NO `name:`, deliberately: the provider shells out to the HOST daemon to
    # attach a workload to this network, and what it names there is the name
    # compose gives it — `toon-sandbox_hs-egress`, project prefix and all.
    # conf/provider-hs.toml's `[anon.egress] network` spells exactly that.
    driver: bridge
    # NO ROUTE OFF THIS HOST except the one `anon-hs` provides. Docker gives an
    # internal network no NAT and installs NO DEFAULT ROUTE in a container on
    # it, so a workload reaches 10.203.0.0/24 and nothing else until the
    # provider's own namespace-owner sidecar points it at the daemon — and a
    # tenant image that ignores every proxy setting still cannot leak where this
    # provider is.
    internal: true
    ipam:
      config:
        - subnet: 10.203.0.0/24
  # The hidden provider's own service network, pinned so conf/anonrc-hs can name
  # its connector and its chain forwarder as IP literals.
  hs-provider:
    name: toon-hs-provider
    ipam:
      config:
        - subnet: 172.30.1.0/24
          # Dynamic addresses come from the UPPER HALF only. `anon-hs` (.2),
          # `provider-hs-connector` (.3) and `hs-provider-ingress` (.4) are
          # pinned, and Docker's IPAM does not reserve a pinned address for a
          # container that has not started yet: on a cold start where
          # `directory-publisher-hs` (dynamic) came up before the connector,
          # it was handed .3 and the connector then failed to start with
          # "Address already in use". A pool disjoint from the pins makes the
          # start order irrelevant (TOON_Network #44).
          ip_range: 172.30.1.128/25

volumes:
  envoy-eds-data:
  relay-data:
  relay-connector-state:
  store-connector-state:
  gas-connector-state:
  anytoon-connector-state:
  # The directory publisher's channel watermark (see that service).
  directory-publisher-state:
  provider-connector-state:
  # The provider's lease table (see the `provider` service).
  provider-state:
  # The second provider's, its connector's and its publisher's (TOON_Network
  # #34) — one of each per provider, never shared.
  directory-publisher2-state:
  provider2-connector-state:
  provider2-state:
  # The issuer's signed epoch keyring + the minter/issuer proxy pair, written
  # by the issuer-keys job. Dev key material; dies with `make clean`.
  anytoon-keys:
  issuer-postgres-data:
  issuer-redis-data:
  # `hs` profile only. anon-data holds this sandbox's `.anyone` address and the
  # private key behind it: it survives `make down` (same address next `make
  # up-hs`) and dies with `make clean` (new address, which is fine here).
  anon-data:
  anon-client-data:
  # THE HIDDEN PROVIDER (TOON_Network #43), `hs` profile only. Same story as
  # anon-data for the first two: anon-hs-data holds the hidden provider's
  # `.anyone` address and the key behind it, and anon-hs-control holds the
  # control cookie the provider authenticates with — a volume of its own, so the
  # provider gets the cookie and not the key. The other three are one lease
  # table, one claim journal and one channel watermark, never shared.
  anon-hs-data:
  anon-hs-control:
  provider-hs-state:
  provider-hs-connector-state:
  directory-publisher-hs-state:
  # The Workload Gateway's connector (`gateway` profile): a claim journal that
  # stays empty — its one route is free — on a volume of its own like every other.
  workload-gateway-connector-state:
