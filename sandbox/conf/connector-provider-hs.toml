# =============================================================================
# provider-hs-connector — terminates g.toon.provider-hs.* in front of THE
# HIDDEN PROVIDER (`provider-hs`), and is reachable only at an `.anyone`
# address. `hs` profile only (TOON_Network #43, spec §10, ADR 0008).
# =============================================================================
# Copied from conf/connector-provider.toml, which is the shape every provider
# connector here has. Two things differ, and both are the point of this node:
#
# 1. IT PUBLISHES NO HOST PORT AND NO CLEARNET ENDPOINT. docker-compose.yml
#    gives it no `ports:` at all, and the [node] endpoints below are RENDERED
#    by scripts/hs-provider-address.sh with the `.anyone` address `anon-hs`
#    generated — `make up-hs` mounts conf/.rendered/connector-provider-hs.toml
#    in place of this file, exactly as it does for the anytoon node. A client
#    dials what a node PUBLISHES, so the endpoint has to be the circuit.
#    The placeholder below is a valid-shaped address that resolves nowhere, so
#    this committed file is honest about what this node is even unrendered.
#
# 2. THERE IS NO PEERING. The hub does not route to this provider and this
#    provider pays the hub nothing: a tenant that wants hidden compute opens a
#    CLIENT channel against this node's own edge, over the circuit, through its
#    own SOCKS proxy (spec Appendix A). That is the whole ingress. Hence no
#    [[peers]], no [[peer_channels]], and no `peer_expose`.
#
# Settlement is the sandbox's own two chains on the private compose network —
# which is also what conf/provider-hs.toml's `anon.settlement_rpc_url` names,
# the "self-hosted RPC" spec §10 requires.

client_edge_addr = "0.0.0.0:3000"
state_dir = "/app/state"

[signer]
key_file = "/app/data/signer.key"

# RENDERED — see the header. scripts/hs-provider-address.sh rewrites exactly
# these two lines, at the start of a line, with the generated address. Port 80
# is the virtual port conf/anonrc-hs forwards to this node's client edge, so
# the address needs no port suffix.
[node]
addresses = ["g.toon.provider-hs"]
http_endpoint = "http://unrenderedplaceholderaddressaaaaaaaaaaaaaaaaaaaaaaaaaaaa.anyone/ilp"
btp_endpoint = "ws://unrenderedplaceholderaddressaaaaaaaaaaaaaaaaaaaaaaaaaaaa.anyone/ilp/btp"

# ── The terminated routes ────────────────────────────────────────────────────
# GENERATED by the provider itself and pasted verbatim:
#
#     docker compose --profile hs run --rm --entrypoint toon-provider \
#       provider-hs routes --config /etc/toon-provider/provider.toml
#
# One spawn and one extend row per listing version at the LISTING PRICE in
# uUSDC per Lease Interval (ADR 0003: one route, one price, no refunds — a
# refusal on a paid route is still billed), plus the three free provider-wide
# rows. A listing change is a new version with new rows here and a restart
# (ADR 0009); re-run the command rather than editing.
[[routes]]
prefix = "g.toon.provider-hs.basic.v1.spawn"
handler_url = "http://provider-hs:8080/listings/basic/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider-hs.basic.v1.extend"
handler_url = "http://provider-hs:8080/listings/basic/v1/extend"
price = 1000

[[routes]]
prefix = "g.toon.provider-hs.smoke.v1.spawn"
handler_url = "http://provider-hs:8080/listings/smoke/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider-hs.smoke.v1.extend"
handler_url = "http://provider-hs:8080/listings/smoke/v1/extend"
price = 1000

[[routes]]
prefix = "g.toon.provider-hs.availability"
handler_url = "http://provider-hs:8080/availability"
price = 0

[[routes]]
prefix = "g.toon.provider-hs.status"
handler_url = "http://provider-hs:8080/status"
price = 0

[[routes]]
prefix = "g.toon.provider-hs.terminate"
handler_url = "http://provider-hs:8080/terminate"
price = 0

# ── Settlement ───────────────────────────────────────────────────────────────
# The sandbox's own chains, by the names the private compose network reaches
# them on. A tenant's client channel is opened against one of them; `anvil` is
# also what a buyer reaches over this node's OWN address at
# `http://<addr>.anyone:8545` (conf/anonrc-hs), so a purchase and the chain
# reads that back it ride the same circuit.
[settlement.evm]
rpc_url = "http://anvil:8545"
contract_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
token_address = "0x5FbDB2315678afecb367f032d93F642f64180aa3"
decimals = 6

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.solana]
rpc_url = "http://solana-validator:8899"
program_id = "HY4AYFNe5Vg5BkEwAURNsGY3uFAvGMNpAQPRtgoasJiR"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

# Operator surface kept ON for the same reason conf/connector-provider.toml
# keeps it: an acceptance test reads THIS node's own /claims to prove a
# purchase was paid, from the payee's book. Loopback-free but unpublished —
# like everything else here, it is reachable only inside the project network.
[operator]
bearer_token_file = "/app/data/operator-bearer.token"
write_keys_file = "/app/data/operator-write.keys"
