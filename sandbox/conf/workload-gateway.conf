# Env for the `workload-gateway` service: the WORKLOAD GATEWAY (TOON_Network
# ADR 0013, spec §12; Milestone 5, #53; Milestone 6, #62), built from the
# ../../gateway sibling checkout and run under the `gateway` profile
# (`make up-gateway`). Environment only, like the directory publisher — the
# gateway has no config file.
#
# NOT the AR.IO gateway. conf/gateway.conf is the permaweb gateway that serves
# `http://<name>.ar.localhost:3000/`; this one fronts a TOON WORKLOAD at a
# stable hostname keyed by its workload id. CONTEXT.md keeps the two apart by
# never saying "gateway" unqualified.
#
# THERE IS NO KEY HERE, and there used to be. Until Milestone 6 this file set
# GATEWAY_SECRET_KEY: the Nostr key a published Gateway Grant named and the
# key the gateway signed `status` with. Nothing is signed or published on
# either side now (spec §12.1, ADR 0016) — a tenant SEALS a Gateway Handover
# to the gateway's own connector, and the gateway presents the derived grant
# as a plain `status` — so the gateway has no key at all. The sandbox
# gateway's identity, as far as a tenant is concerned, is its connector's
# sealing key (keys/toon/workload-gateway-connector/signer.key), which
# scripts/handover.mjs pins from that file.

# The sandbox gateway domain. Every handed-over workload is served at
# `<canonical label>.gw.localhost` — the label is the lowercase unpadded base32
# of the workload id, 52 characters (spec §12.2) — and a handover's `name` at
# `<name>.gw.localhost`. `*.localhost` resolves to loopback on a modern
# resolver with nothing added to anyone's DNS (README §2, "The Workload
# Gateway"), exactly as `*.ar.localhost` already does for the permaweb half.
GATEWAY_DOMAIN=gw.localhost

# Where its connector forwards a sealed Gateway Handover — and a sealed
# Gateway Withdrawal, which rides the same route (spec §12.1, §12.7). Its OWN
# listener inside the container, reached ONLY from the compose network by
# workload-gateway-connector (conf/connector-workload-gateway.toml's
# handler_url names it, path and all); docker-compose.yml publishes it on no
# host port, deliberately: a handover that did not come through the connector
# is not a message this sandbox rehearses. Required by the gateway, no default.
GATEWAY_HANDOVER_PORT=8081

# How many admission rounds any one provider may be asked for in a minute
# (spec §12.1): anyone can seal a handover, so this bounds the `status` a
# stranger's packets can make the gateway send. The gateway's default, 6,
# stated here because a developer re-running scripts/handover.mjs against one
# provider more often than that is told `rate_limited` and should know where
# the number lives.
GATEWAY_ADMIT_PER_MINUTE=6

# Where it reads relays — for exactly two things, both downstream of a
# handover it has already admitted (spec §12.1): the Provider Profiles of the
# members a handover names, and the Takeovers that move a workload between
# them (§12.7). It watches for no grants: there are none to watch for. The
# sandbox relay by the name the compose network reaches it on; also every
# relay a member's Profile names — here the same one, as ws://relay:7100,
# which conf/provider.toml publishes.
GATEWAY_RELAYS=ws://relay:7100

# Both listeners, side by side (spec §12.2 says a plain listener is a
# deployment choice): TLS for *.gw.localhost with the self-signed wildcard
# certificate under conf/workload-gateway-tls/, published on the host at 3443;
# plain HTTP for smokes and `curl`, published at 3280. docker-compose.yml
# mounts the pair read-only at /etc/workload-gateway/tls.
GATEWAY_HTTPS_PORT=8443
GATEWAY_HTTP_PORT=8080
GATEWAY_TLS_CERT=/etc/workload-gateway/tls/gw.localhost.crt
GATEWAY_TLS_KEY=/etc/workload-gateway/tls/gw.localhost.key

# The buyer-side SOCKS proxy for `.anyone` hosts: the `anon-client` daemon of
# the `hs` profile, which the gateway shares the `hs-payer` network with. Only
# VALIDATED at startup — nothing is dialled until a handover names a hidden
# member — so under `make up-gateway` alone, where no such container exists,
# this line is harmless; under `make up-gateway-hs` it is the whole hidden
# path (README §2, "Reaching a hidden workload by hand"). `socks5h`, never
# `socks5`: the daemon resolves the name, so it never enters a DNS query.
TOON_SOCKS_PROXY=socks5h://anon-client:9050

# SANDBOX-ONLY, and the one line here that would be wrong in a deployment. A
# member is dialled where its Profile and its `status` answer say it is, and
# in this sandbox neither is where this container can reach it:
#   - a Profile's connector_url is http://provider-connector:3000/ilp — a
#     connector client edge that terminates SEALED packets. The gateway sends
#     `status` as the plain §6.1 body (gateway README, "How status is sent"),
#     which is what the provider APP serves at provider:8080/status, the
#     handler_url conf/connector-provider.toml forwards the route to. So the
#     connector's name is dialled at the app: same request, same free route,
#     one hop shorter.
#   - a running member's access.host is 127.0.0.1 (conf/provider.toml's
#     public_ip): the workloads run on the HOST daemon and publish there, and
#     from inside this container 127.0.0.1 is the gateway itself. The host is
#     host.docker.internal, which docker-compose.yml maps to the host gateway.
# One map, applied at the gateway's one dial seam, so `status` and forwarding
# agree; it rewrites no URL and no header (gateway README, GATEWAY_DIAL_REWRITE).
# The hidden provider's `status` needs an entry of its own, at an address only
# `make up-hs` knows — scripts/hs-provider-address.sh renders it into
# conf/.rendered/workload-gateway-hs.env (README §2, the hand recipe).
GATEWAY_DIAL_REWRITE={"provider-connector:3000":"provider:8080","provider2-connector:3000":"provider2:8080","127.0.0.1":"host.docker.internal"}
