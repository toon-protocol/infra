# =============================================================================
# anytoon-connector — terminates g.anyone.credentials in front of the Anyone
# Protocol credentials issuer (through the claim minter), and takes the hub's
# forwarded traffic as a PAYING CLIENT rather than as a peer. Read the next
# block before changing that; it is the one thing here that differs from
# conf/connector-store.toml and conf/connector-gas.toml, and it is forced.
# =============================================================================
# Shape lifted from the anytoon repo's own config/connector.local.toml (the
# sibling checkout at ../../anytoon), which is the upstream-proven config for
# this exact app pair. That file's own header warns: "this node terminates its
# own routes and does not peer... Because nobody forwards to us, we always
# collect, so X-TOON-Payer is always present on a delivery and the minter's
# fail-closed path is an assertion rather than a routine outcome. ADDING A PEER
# IS THE CHANGE THAT FORCES THAT DECISION TO BE REVISITED." This file is that
# revisit.
#
# WHY THERE IS NO [[peers]] ROW HERE, unlike store/gas
# ---------------------------------------------------
# The claim minter behind this node needs to know WHO PAID: it turns the
# connector's X-TOON-Payer attribution into the signed X-Payment-Claim the
# issuer demands, and 402s PAYER_UNATTRIBUTED without one. The store and the
# gas station are payment-oblivious and never look.
#
# A connector states a payer ONLY for a client claim it admitted at its OWN
# client edge. A PEER-ROLE arrival states nothing — deliberately, and it is
# protocol law rather than a gap: connector ADR 0040 ("a verified payment is
# stated to the app") says a forwarded packet "cannot state a payer... there is
# no fallback to interrogate the previous hop with, because the previous hop
# was never an input", and forbids any implementation from falling back to the
# previous hop's identity (that was ADR 0017's defect, and it "puts a wrong
# payer in an app's own permanent records"). So had this node held the channel
# as [[peer_channels]] like store/gas do, every paid bundle purchase routed
# through the hub would reach the minter unattributed and be refused — after
# the client had already paid for it.
#
# The resolution is to state the truth rather than to invent one: on this
# channel the HUB IS A PAYING CLIENT of this node. It signs a client-role
# cover-forward claim before every forwarded PREPARE leaves (ADR 0042 item 2),
# so declaring the channel in [[client_channels]] makes this node's own client
# edge admit that claim — and the delivery then carries a payer that is exactly
# who paid THIS node: `solana:<channel_account>`, the hub. Per-hub rather than
# per-end-client bucketing is also the right shape for a wholesale hop, and it
# is the only shape the end client's anonymity permits.
#
# The trade, stated plainly: this node can no longer take the peer role with
# the hub on this channel ([[peers]] without a matching [[peer_channels]] row
# is a load-time refusal, and a channel may not sit in both namespaces), so the
# peer-book claim ack, the peer F03 price gate and forwarded_claim_enforcement
# are replaced by their client-edge equivalents rather than kept. The HUB is
# untouched — it keeps [[peers]], the forwarded [[routes]] row, and the
# [[peer_channels]] + [[pay_channels]] pair, and that asymmetry is legal
# (the both-namespaces check is per-file). The hub MUST keep its
# [[peer_channels]] row: a Solana claim's wire `programId` is read from it.
#
# Both ends must agree on [settlement.solana] program_id — the hub binds it
# into the signed message (ADR 0053) and this node copies its own in when it
# resolves the [[client_channels]] row. They do, below.

client_edge_addr = "0.0.0.0:3000"
state_dir = "/app/state"

# NO peer_expose: this node never takes the peer role (see above). The hub
# dials this same client_edge_addr and its claim is admitted as a client's.

[signer]
key_file = "/app/data/signer.key"

[node]
addresses = ["g.anyone.credentials"]
http_endpoint = "http://127.0.0.1:3230/ilp"
btp_endpoint = "ws://127.0.0.1:3230/ilp/btp"

# ── The terminated routes ────────────────────────────────────────────────────
#
# PRICE COUPLING — the hazard this whole subsystem turns on. Three numbers must
# agree or every paid bundle purchase answers 402 CLAIM_INVALID:
#
#   1. `price` below, in BASE UNITS
#   2. the claim minter's BUNDLE_PRICE (the decimal it signs into the claim)
#   3. the issuer's BUNDLE_PRICE (the decimal it checks the claim against)
#
# (2) and (3) are ONE place — conf/anytoon.conf, the `env_file` of both
# services, so they cannot drift from each other. (1) cannot be an env var (the
# connector has no environment layer) and is therefore the derivation:
#
#   10000 base units / 10^6 (mock USDC decimals) = 0.01 = conf/anytoon.conf
#
# scripts/smoke-toon.mjs re-derives it from conf/anytoon.conf on every run and
# asserts it against what this node ADVERTISES at GET /ilp, so a drift fails by
# name rather than as an unexplained 402.
[[routes]]
prefix = "g.anyone.credentials"
handler_url = "http://claim-minter:8080/"
price = 10000

# The key document is FREE: a buyer needs the epoch key before it can blind
# anything, and charging for it makes the protocol undiscoverable.
#
# handler_url IS SCOPED TO /v1/keys/ ON PURPOSE, and this is the security
# property of the pair. An envelope's `target` resolves BENEATH the handler
# path (connector-runtime/src/app_client.rs resolve_target_under_handler), so
# pointing this row at the issuer ROOT would put POST /v1/bundles behind a
# price-0 route — free credentials, and the issuer's invariant I6 ("no free
# class exists anywhere in this service") broken from outside. Scoped here,
# `current` is the only reachable target and an escape attempt (`..`, `%2e%2e`,
# a leading `/`, a `\`, a scheme) is refused F00 by the connector before the
# issuer is touched. scripts/smoke-toon.mjs asserts BOTH halves: `current`
# serves free, and `../bundles` off this same free route does not reach the
# issuer.
#
# Longest-prefix wins (connector-domain/src/route.rs select_route), so a packet
# to g.anyone.credentials.keys takes THIS row and not the priced one above,
# whatever order they appear in.
[[routes]]
prefix = "g.anyone.credentials.keys"
handler_url = "http://issuer:3000/v1/keys/"
price = 0

# The issuer's /healthz and its /v1/entitlements (the fiat rail) are
# deliberately NOT routed. The connector's own free, unauthenticated
# /ilp/identity is the public liveness signal; the issuer's health stays inside.

# ── The hub, as a client ─────────────────────────────────────────────────────
# The same on-chain channel the hub names in its [[peer_channels]] and
# [[pay_channels]] rows — opened and collateralised post-boot by the
# open-toon-solana-channels init job, through the hub's own operator surface
# (the payer side opens and deposits; the program's Deposit credits strictly by
# signer). Declared HERE as a client channel, for the reason set out at the top
# of this file.
#
# `counterparty` (singular) is the hub's SOLANA settlement public key — the key
# whose signature this node accepts on the claim. `program_id` is NOT a field
# here and writing one is a confusing shape-match failure, not a named error:
# it is copied in from [settlement.solana] below. A config-declared client
# channel carries no deposit floor, so nothing on the packet path reads the
# chain for it.
#
# Phase 1 settles this hop in the sandbox's existing 6-decimal mock USDC,
# exactly like the relay-store and relay-gas peerings (Phase 2 — an 18-decimal
# mock ANYONE leg under a USDC client leg — is blocked upstream on
# toon-protocol/connector#1286 and is NOT attempted here).
[[client_channels]]
channel_account = "3ZA8DPi18Jkjn8pCQkX1ZFezSmYW7RZfdhkQVeyVPwez"
counterparty = "9gXKH3AtUErhsAVaLmBkiJxdtUmUE29MjaRLFKxCqfAx" # relay-connector Solana settlement

[settlement.evm]
rpc_url = "http://anvil:8545"
contract_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
token_address = "0x5FbDB2315678afecb367f032d93F642f64180aa3"
decimals = 6

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.solana]
rpc_url = "http://solana-validator:8899"
program_id = "HY4AYFNe5Vg5BkEwAURNsGY3uFAvGMNpAQPRtgoasJiR"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

# Kept ON so the smoke test can read this payee's /claims and prove the
# hub -> anytoon leg was actually paid, from the payee's own book. Because the
# hub is a client here, its payments land in the CLIENT book, keyed
# `solana:<channel_account>` (the client book chain-namespaces its channel ids;
# the peer book does not) — which is what the smoke asserts.
[operator]
bearer_token_file = "/app/data/operator-bearer.token"
write_keys_file = "/app/data/operator-write.keys"
