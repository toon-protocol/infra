# =============================================================================
# anytoon-connector — terminates g.anyone.credentials in front of the Anyone
# Protocol credentials issuer (through the claim minter), paid in ANYONE on
# anvil. Its paying customer for hub-routed purchases is the DEALER
# (conf/connector-dealer.toml, infra ADR 0003), and it takes the dealer as a
# CLIENT, not a peer. Read the next block before changing that.
# =============================================================================
# Shape lifted from the anytoon repo's own config/connector.local.toml (the
# sibling checkout at ../../anytoon). That file's header says this node
# "terminates its own routes and does not peer... Because nobody forwards to us,
# we always collect, so X-TOON-Payer is always present on a delivery... ADDING A
# PEER IS THE CHANGE THAT FORCES THAT DECISION TO BE REVISITED."
#
# WHY THIS NODE BINDS NOTHING FOR THE DEALER
# ------------------------------------------
# The claim minter behind this node needs to know WHO PAID: it turns the
# connector's X-TOON-Payer into the signed X-Payment-Claim the issuer demands,
# and 402s PAYER_UNATTRIBUTED without one.
#
# A connector states a payer only for a voucher it admitted in the CLIENT role.
# A peer-role arrival states nothing, and that is protocol law, not a gap:
# connector ADR 0040 says a forwarded packet "cannot state a payer", and forbids
# falling back to the previous hop's identity (ADR 0017's defect, which "puts a
# wrong payer in an app's own permanent records"). An arrival takes the peer
# role when its voucher is signed by a key this node has bound to a peering —
# a `[[peer_channels]]` row, or a `POST /peers` naming the sender. So if this
# node bound the dealer, every bundle it forwarded would reach the minter
# unattributed and be refused, after the client had paid.
#
# So it binds nothing: no `[[peers]]`, no `[[peer_channels]]`, no POST /peers,
# no `peer_expose`. The dealer's own POST /peers opens an x402 channel toward
# this node's settlement key and pays each forward with a voucher on it, which
# arrives here as a client's; the delivery then names the payer that is exactly
# who paid THIS node — `evm:0x<the dealer's channel id>`. Per-dealer rather than
# per-end-client is the right shape for a wholesale hop, and the only one the
# end client's anonymity permits. The dealer's payments land in this node's
# CLIENT book under that key, which is what scripts/smoke-toon.mjs asserts.
#
# Two things this costs, both checked by the connector release the sandbox
# pins (2026.09.29.1):
#   * the routes below must stay UNPINNED (no `transport`), or pinned to the
#     carriage the dealer actually dials (connector ADR 0072): a client is
#     refused a route pinned to another carriage;
#   * a ZERO-value forward is sent as a peer-role claim-state challenge rather
#     than a voucher, and arrives here as a client packet with no voucher. That
#     is fine only because the one route that can see one, the key document, is
#     free here.
#
# ONE TOKEN, ONE CHAIN. This node is paid ANYONE on anvil and has NO
# `[settlement.solana]`: an arriving voucher is denominated by the chain its
# channel is on, and a route has one price, so a Solana channel here would be
# charged this file's ANYONE price as µUSDC — off by 10^12. It deals nothing
# either (no `[[tokens]]`): the conversion happens one hop upstream, in the
# dealer, which is the right place for it.

client_edge_addr = "0.0.0.0:3000"
state_dir = "/app/state"

[signer]
key_file = "/app/data/signer.key"

# The compose-network name, which is what the dealer's POST /peers reads and
# dials: a node dials the endpoints another PUBLISHES. No `btp_endpoint`, for
# the same reason: POST /peers prefers BTP wherever a node publishes it.
#
# `make up-hs` mounts conf/.rendered/connector-anytoon.toml instead, with this
# line pointed at the `.anyone` address (scripts/hs-address.sh), because a
# buyer over the circuit dials what this node publishes too. It does that only
# AFTER the open-peerings job has run against this committed file, so the
# dealer's runtime peering keeps the compose name (see the Makefile's up-hs).
[node]
addresses = ["g.anyone.credentials"]
http_endpoint = "http://anytoon-connector:3000/ilp"

# ── The terminated routes ────────────────────────────────────────────────────
#
# THE PRICE TRIPLE. Three numbers must agree or every paid bundle purchase
# answers 402 CLAIM_INVALID:
#
#   1. `price` below, in ANYONE BASE UNITS (18 decimals)
#   2. the claim minter's BUNDLE_PRICE (the decimal it signs into the claim)
#   3. the issuer's BUNDLE_PRICE (the decimal it checks the claim against)
#
# (2) and (3) are one place — conf/anytoon.conf, the `env_file` of both
# services. (1) cannot read an env var, so it is the derivation:
#
#   40000000000000000 base units / 10^18 = 0.04 ANYONE
#
# 0.04 ANYONE is 0.01 USDC at the sandbox's mid rate. The dealer's µUSDC price
# for the same route is NOT this figure plus a fee: it is quoted in the
# client's money and carries an FX buffer, and conf/connector-dealer.toml owns
# that arithmetic. scripts/smoke-toon.mjs re-derives this one from
# conf/anytoon.conf and asserts it against what this node advertises.
[[routes]]
prefix = "g.anyone.credentials"
handler_url = "http://claim-minter:8080/"
price = 40000000000000000

# The key document is FREE: a buyer needs the epoch key before it can blind
# anything, and charging for it makes the protocol undiscoverable.
#
# handler_url IS SCOPED TO /v1/keys/ ON PURPOSE, and this is the security
# property of the pair. A target resolves BENEATH the handler path, so pointing
# this row at the issuer ROOT would put POST /v1/bundles behind a price-0 route
# — free credentials, and the issuer's invariant I6 ("no free class exists
# anywhere in this service") broken from outside. Scoped here, `current` is the
# only reachable target and an escape (`..`, `%2e%2e`, a leading `/`) is refused
# F00 by the connector before the issuer is touched. scripts/smoke-toon.mjs
# asserts both halves. Longest prefix wins, so g.anyone.credentials.keys takes
# this row whatever the order.
[[routes]]
prefix = "g.anyone.credentials.keys"
handler_url = "http://issuer:3000/v1/keys/"
price = 0

# The issuer's /healthz and /v1/entitlements (the fiat rail) are deliberately
# NOT routed.

# ── Settlement ───────────────────────────────────────────────────────────────
# ANYONE, the real mainnet ERC-20 at its own address (scripts/
# seed-toon-evm-amm.sh). `decimals = 18` is checked against its `decimals()`.
#
# `asset_transfer_method = "permit2"`: the default is eip3009, which boot
# refuses on a token without ERC-3009, and ANYONE has none. A payer deposits
# through `Permit2DepositCollector` after a one-time `approve` of Permit2 — the
# dealer's connector sends its own; smoke-hs's buyer pays its own from anvil
# ETH. The EIP-712 name and version are required and published, and not
# checked under permit2 (a Permit2 deposit is signed under Permit2's domain).
#
# NO facilitator_url: the Onboarder pays for no Permit2 approval
# (`erc20ApprovalGasSponsoring` is out of scope for the sandbox), so a payer
# here pays its own gas.
[settlement.evm]
rpc_url = "http://anvil:8545"
token_address = "0xFeAc2Eae96899709a43E252B6B92971D32F9C0F9"
decimals = 18
asset_eip712_name = "ANyONe Protocol"
asset_eip712_version = "1"
asset_transfer_method = "permit2"

[settlement.evm.key]
key_file = "/app/data/settlement.key"

# Kept ON so the smokes can read this payee's /claims and prove the
# dealer -> anytoon leg was paid, from the payee's own book, in ANYONE base
# units, keyed `evm:0x<the dealer's channel id>`.
[operator]
bearer_token_file = "/app/data/operator-bearer.token"
write_keys_file = "/app/data/operator-write.keys"
