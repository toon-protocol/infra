# =============================================================================
# provider2-connector — terminates g.toon.provider2.* in front of the SECOND
# compute provider (toon-provider, the `provider2` compose service) and is the
# PAYEE of the relay-provider2 peering.
# =============================================================================
# Copied from conf/connector-provider.toml — README §5 Level 2 — and different
# from it in exactly three places: the node's address and endpoint, the
# handler origin (provider2:8080), and the key directory it mounts (its
# peering with the hub is scripts/peerings.mjs's `relay-provider2`). The settlement keys are the sandbox's next free
# mnemonic indices, 30 (EVM) and 39 (Solana); see scripts/gen-toon-keys.sh.
#
# WHY A SECOND CONNECTOR AT ALL (TOON_Network #34): a provider's connector is
# what a tenant seals a spawn to (ADR 0011) and what its Profile publishes as
# its sealing key. Two providers behind ONE connector would be one payee with
# two names — the Standby Set that Milestone 3 sells would be a fiction. So the
# second provider gets the whole shape: its own identity, its own client edge,
# its own peering with the hub and its own channel.

client_edge_addr = "0.0.0.0:3000"
state_dir = "/app/state"

peer_expose = "http"

# The hub is a plain http:// container port too, and this node reads its
# self-description and dials it to open its own reverse channel.
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What this node publishes at GET /ilp, and so what the hub DIALS: its
# compose-network name, because the hub's `POST /peers` reads this document and
# dials the endpoint in it. A host-run client reaches the same node at
# 127.0.0.1:3250 (scripts/lib/sandbox-endpoints.mjs). No `btp_endpoint`:
# `POST /peers` prefers BTP wherever a node publishes it, and this peering
# rides HTTP.
[node]
addresses = ["g.toon.provider2"]
http_endpoint = "http://provider2-connector:3000/ilp"

# ── The terminated routes ────────────────────────────────────────────────────
# GENERATED by the provider itself — `toon-provider routes --config
# conf/provider2.toml` (run it in the `provider2` container, or from the
# sibling checkout) — and pasted verbatim. Two rows per live listing version at
# the listing price, FOUR for a version that prices Warm Standbys: the
# `.standby` and `.standby.extend` rows below are printed only because
# conf/provider2.toml's `warm` tier sets `standby_price` (spec §7), and they
# are priced at THAT figure, not at the running price. A tier that sells no
# standby gets neither row, so this connector can never terminate a standby
# route its provider did not price. Re-run the command after every listing
# change rather than editing here (ADR 0009).
[[routes]]
prefix = "g.toon.provider2.basic.v1.spawn"
handler_url = "http://provider2:8080/listings/basic/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider2.basic.v1.extend"
handler_url = "http://provider2:8080/listings/basic/v1/extend"
price = 1000

[[routes]]
prefix = "g.toon.provider2.smoke.v1.spawn"
handler_url = "http://provider2:8080/listings/smoke/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider2.smoke.v1.extend"
handler_url = "http://provider2:8080/listings/smoke/v1/extend"
price = 1000

[[routes]]
prefix = "g.toon.provider2.warm.v1.spawn"
handler_url = "http://provider2:8080/listings/warm/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider2.warm.v1.extend"
handler_url = "http://provider2:8080/listings/warm/v1/extend"
price = 1000

[[routes]]
prefix = "g.toon.provider2.warm.v1.standby"
handler_url = "http://provider2:8080/listings/warm/v1/standby"
price = 400

[[routes]]
prefix = "g.toon.provider2.warm.v1.standby.extend"
handler_url = "http://provider2:8080/listings/warm/v1/standby/extend"
price = 400

[[routes]]
prefix = "g.toon.provider2.availability"
handler_url = "http://provider2:8080/availability"
price = 0

[[routes]]
prefix = "g.toon.provider2.status"
handler_url = "http://provider2:8080/status"
price = 0

[[routes]]
prefix = "g.toon.provider2.terminate"
handler_url = "http://provider2:8080/terminate"
price = 0

[[routes]]
prefix = "g.toon.provider2.rotate"
handler_url = "http://provider2:8080/rotate"
price = 0
# ── The peering with the hub: not in this file ───────────────────────────────
# ADR 0075: a peering is two one-way x402 channels, each opened by its own node
# with a fresh salt, so no config can name one. The `open-peerings` init job
# (scripts/open-peerings.mjs, table in scripts/peerings.mjs) sends this node a
# signed `POST /peers` naming the hub FIRST — binding the hub's voucher signer,
# so every forwarded packet arrives in the PEER role, and opening this node's
# own small channel back toward the hub through the hub's sponsor endpoint —
# and then the hub its own, which opens the channel that pays this node.

# ── Settlement ───────────────────────────────────────────────────────────────
# The hub's terms exactly (conf/connector-relay.toml says why each value is
# what it is): FiatToken USDC on anvil, named "USDC"/"2", deposited through the
# sandbox's Onboarder; the mock USDC mint on the validator, sponsored from
# 1 USDC. Every channel is an x402 channel (connector ADR 0075).
[settlement.evm]
rpc_url = "http://anvil:8545"
token_address = "0x0A867CA0442383c2A89951244B955AA19b615b58"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"
asset_transfer_method = "eip3009"
facilitator_url = "http://onboarder:4022"

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.solana]
rpc_url = "http://solana-validator:8899"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6
min_sponsored_deposit = 1000000

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

# On for the same reason as the first provider connector's: the smokes read
# THIS node's /claims to prove the peering crossing was paid, from the payee's
# own book.
[operator]
bearer_token_file = "/app/data/operator-bearer.token"
write_keys_file = "/app/data/operator-write.keys"
