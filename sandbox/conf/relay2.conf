# Env for the `relay2` service: THE SECOND RELAY, behind relay2-connector
# (`make up-topology NODES="relay relay2"`; no aggregate profile runs it).
# conf/relay.conf with its own Nostr IDENTITY — two relays sharing a key would
# be one relay to every client that knows them by pubkey. A committed
# throwaway, like the first one's.
TOON_BLS_PORT=3100
TOON_RELAY_PORT=7100
TOON_DATA_DIR=/data
NOSTR_SECRET_KEY=e9f74da772652d15df6427a709c65ef3b6ccbcdffe049fcbd600f574cf6e3b44
# The three below are conf/relay.conf's, for the reasons given there.
TOON_DEV_MODE=false
TOON_VERIFY_EPHEMERAL=false
TOON_ENFORCE_EXPIRATION=false
# ITS OWN connector and ITS OWN write address, never the first relay's: a
# relay told the hub's would publish a document sending this relay's writes to
# the other one. conf/relay.conf says what the two are and how they are used.
TOON_CONNECTOR_URL=http://relay2-connector:3000/ilp
TOON_WRITE_ILP_ADDRESS=g.toon.relay2
# Its own paid live feed, conf/relay.conf's for the reasons given there: its
# own connector's subscribe route, and the URL a subscriber dials it at — the
# read port the sandbox publishes for it (ws://<address>.anyone:7110 when
# `make up-topology HS=relay2` hides it, through RELAY2_ENV).
TOON_SUBSCRIBE_ILP_ADDRESS=g.toon.relay2.subscribe
TOON_BROADCAST_PRICE=1
TOON_RELAY_URL=ws://localhost:7110
