# Env for the `relay` service (TOON Nostr relay). Values follow the relay
# repo's deploy bundle and the pokerogue devnet reduction of it.
# NOSTR_SECRET_KEY is the relay's own Nostr IDENTITY, not money — a committed
# throwaway so the pubkey clients know this relay by survives `make clean`.
TOON_BLS_PORT=3100
TOON_RELAY_PORT=7100
TOON_DATA_DIR=/data
NOSTR_SECRET_KEY=872ec7b823880dece6a21befbfc44f4c9dcaa39277ce35ffe14e801d9401ca7d
# FALSE deliberately: dev mode would skip schnorr verification on writes and
# make "a paid write reached the relay" pass for an event nobody signed.
TOON_DEV_MODE=false
# The paid-ephemeral verify skip stays ON (false) because the write port 3100
# is reachable exclusively through the connector here too.
TOON_VERIFY_EPHEMERAL=false
# A sandbox that reaps stored events mid-session tests nothing but the reaper.
TOON_ENFORCE_EXPIRATION=false
# WHERE A WRITE TO THIS RELAY IS PAID (infra#51), which the relay publishes as
# the `toon` object of its information document (`GET /` on the read port,
# `Accept: application/nostr+json`). It is told two things and reads the rest
# — endpoint, seal key, price, settlement — off the connector's free GET /ilp,
# again every five minutes, so the document cannot disagree with the node
# that enforces it. With either unset it publishes no `toon` object at all.
#
# Its connector's self-description, by compose name: what THIS container can
# reach. The document carries what the connector PUBLISHES, not this URL.
TOON_CONNECTOR_URL=http://relay-connector:3000/ilp
# WHICH of that connector's routes reaches this relay's POST /write — the one
# fact a self-description leaves out (it lists prefixes and prices, never a
# handler_url). The prefix of the conf/connector-relay.toml route whose
# handler_url is http://relay:3100/write; scripts/lib/relay-document.test.mjs
# holds the two equal, and the relay refuses an address its connector does not
# terminate rather than publish it.
TOON_WRITE_ILP_ADDRESS=g.toon.relay
