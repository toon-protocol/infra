# =============================================================================
# THE PRICE OF ONE CREDENTIALS BUNDLE — the single source of truth.
# =============================================================================
# This file is the `env_file` of BOTH the `issuer` and the `claim-minter`, so
# two of the three sites that must agree are literally one site.
#
# THE PRICE IS IN ANYONE. The anytoon-connector settles this route in the real
# ANYONE ERC-20 on anvil (18 decimals), not in mock USDC, so the decimal below
# is a quantity of ANYONE. 0.04 ANYONE is 0.01 USDC at the rate this sandbox
# deals at (conf/amm-topology.conf) — the same money this route has always
# cost, said in the currency the node is actually paid in.
#
# THE THIRD SITE is the connector route price in conf/connector-anytoon.toml,
# which cannot read an env var (the connector has NO environment layer — every
# value comes from its TOML). It is therefore written as BASE UNITS and must be
# kept equal to this decimal by hand:
#
#     connector price (base units) = BUNDLE_PRICE * 10^18      (ANYONE, 18dp)
#     0.04 ANYONE                  = 40000000000000000 base units
#
# THE HUB'S FORWARDED PRICE IS NO LONGER A FOURTH SITE, and that is the one
# thing about this file that changed with the cross-asset flip. The hub charges
# its client in uUSDC on a Solana channel and pays this node in ANYONE on an
# anvil channel, converting at a LIVE Uniswap v3 TWAP. A live rate cannot be
# folded into a committed number, so the hub quotes a static uUSDC price with
# an FX buffer sized to the rate's band, and that derivation lives in
# conf/connector-relay.toml where the band is. Do not try to derive it here.
#
# WHAT DRIFT LOOKS LIKE: the minter signs a claim carrying `amount` =
# BUNDLE_PRICE; the issuer verifies that amount against its OWN BUNDLE_PRICE.
# Because both read this file they can never disagree — but if the connector's
# base-unit price drifts from it, the connector simply charges the wrong money
# for a bundle that still issues (or, under-priced against a downstream that
# wants more, every forwarded PREPARE is refused F06).
#
# `scripts/smoke-toon.mjs` asserts the derivation on every run: it reads this
# file, multiplies by 10^18, and compares against the price the anytoon
# connector actually ADVERTISES at GET /ilp. It then separately asserts that
# the hub's static uUSDC price still covers this figure at the LIVE rate it
# reads from the hub's own GET /rates. A drift on either side fails the smoke
# by name instead of surfacing as a 402 nobody can explain.
#
# Changing the price: edit the line below, then update `price` in
# conf/connector-anytoon.toml, re-check the headroom arithmetic in
# conf/connector-relay.toml's `g.anyone.credentials` row, and re-run
# `make smoke`.
BUNDLE_PRICE=0.04
