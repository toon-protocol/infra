# =============================================================================
# relay-connector — the HUB. Terminates the relay's paid write routes and its
# paid live feed's subscribe route, and
# FORWARDS g.toon.store / g.toon.gastation / g.toon.provider.* /
# g.toon.provider2.* over four peerings.
# =============================================================================
# Three things to know before editing (from the connector's own config docs):
#   1. There is NO environment-variable layer; every value comes from this file.
#   2. Every table is deny_unknown_fields — a typo is a load failure by name,
#      and so is every retired key (connector ADR 0075: `contract_address`,
#      `program_id`, `[[client_channels]]`, and any channel row naming a
#      `channel_id`/`channel_account`/`counterparty_key`).
#   3. Startup is FAIL-CLOSED: missing key file / unreachable chain = exit 1.
#
# EVERY CHANNEL IS AN x402 batch-settlement CHANNEL (connector ADR 0075), on
# `x402BatchSettlement` on anvil and on solana-foundation's `payment-channels`
# on the validator — both constants of the binary, placed on the local chains
# by scripts/seed-x402.sh and docker-compose.yml's validator. A client pays
# this node from a channel it opens itself: on EVM through the Onboarder this
# node names below, on Solana through this node's own sponsor endpoint.
#
# THE PEERINGS ARE NOT IN THIS FILE. A peering is two one-way x402 channels,
# each opened by its own node with a fresh salt, so no config can name one;
# the `open-peerings` init job writes them at runtime through each node's
# signed `POST /peers`, and this node's forwarding routes with
# `POST /routes/peers` (a config route may only name a peer the same file
# declares, connector ADR 0034). The table, fees and forwarding prices are
# scripts/peerings.mjs; `GET /peers` and `GET /routes/peers` show them live.
#
# The ANYONE flip this node used to deal (connector ADR 0071) lives in the
# Dealer now (conf/connector-dealer.toml, infra ADR 0003): a node holds one
# token per chain, and this one settles USDC on EVM. This node keeps no ANYONE
# and no quote; it forwards g.anyone.credentials* to the dealer over Solana at
# par, like any other peering (scripts/peerings.mjs, `relay-dealer`).

client_edge_addr = "0.0.0.0:3000"

# Claim journal, outbound-channel journal and the runtime peer/route table
# (named volume; the image ships /app/state owned by uid 10001, which a fresh
# named volume inherits and a bind does not).
state_dir = "/app/state"

# A peering is established from BOTH ends, so this node is dialled as well as
# dialling: each payee's own `POST /peers` reads this node's self-description
# and opens its reverse channel through this node's sponsor endpoint. `http`
# carriage only — the one every node here publishes.
peer_expose = "http"

# Every peer here is a plain http:// container port. A peer endpoint is
# wss/https-only unless a node says otherwise; local dev says so.
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What this node says about itself on GET /ilp — and what a PEER dials. So
# the compose-network name, which every container reaches: a payee's
# `POST /peers` dials exactly this. A host-run smoke reaches the same node at
# 127.0.0.1:3200 through scripts/lib/sandbox-endpoints.mjs, and the directory
# publishers need no rewrite at all. No `btp_endpoint`: `POST /peers` prefers
# BTP wherever a node publishes it, and the peerings here ride HTTP.
[node]
addresses = ["g.toon.relay", "g.toon.relay.ephemeral", "g.toon.relay.subscribe"]
http_endpoint = "http://relay-connector:3000/ilp"

# ── Terminated: the relay's paid write path ──────────────────────────────────
[[routes]]
prefix = "g.toon.relay"
handler_url = "http://relay:3100/write"
price = 1

[[routes]]
prefix = "g.toon.relay.ephemeral"
handler_url = "http://relay:3100/write-ephemeral"
price = 0

# ── Terminated: the relay's paid live feed (infra#53) ───────────────────────
# A subscription is paid here: every packet to this address credits its price
# to the subscriber key in its NIP-98 header, and each live event the relay
# broadcasts to that key debits TOON_BROADCAST_PRICE (conf/relay.conf). The
# relay publishes this route — address and price, read off GET /ilp — as its
# information document's `toon_subscription`, and only while the price is
# FLAT and ABOVE ZERO: a free route or one priced by the KiB is no offer
# (relay's docs/paid-feed.md). On the write port for the reason /write is:
# only this connector reaches it.
[[routes]]
prefix = "g.toon.relay.subscribe"
handler_url = "http://relay:3100/subscribe"
price = 1

# ── Settlement ───────────────────────────────────────────────────────────────
# EVM: Circle's FiatToken v2.2 as USDC, deployed by scripts/seed-x402.sh at a
# deterministic address (anvil-mnemonic index 20, nonce 1). Its EIP-712 domain
# is "USDC" / "2", which a client signs its ERC-3009 deposit under and boot
# checks against the token's own DOMAIN_SEPARATOR() (connector #1425).
# `facilitator_url` is the sandbox's Onboarder, which relays a 0-ETH payer's
# deposit and pays its gas (connector ADR 0076); this node publishes it and
# never calls it. A host-run client reaches it at localhost:4022.
[settlement.evm]
rpc_url = "http://anvil:8545"
token_address = "0x0A867CA0442383c2A89951244B955AA19b615b58"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"
asset_transfer_method = "eip3009"
facilitator_url = "http://onboarder:4022"

[settlement.evm.key]
key_file = "/app/data/settlement.key"

# Solana: the deterministic mock USDC mint (scripts/seed-toon-solana.mjs).
# `min_sponsored_deposit` is the smallest opening deposit this node's sponsor
# endpoint co-signs an `open` for — 1 USDC, as on the devnet — and what bounds
# the rent a stranger can make it spend. The key must hold SOL before boot
# (seed-toon-solana funds it); it pays every sponsored open's rent.
[settlement.solana]
rpc_url = "http://solana-validator:8899"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6
min_sponsored_deposit = 1000000

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

# ── Operator surface ─────────────────────────────────────────────────────────
# Reads (GET /claims — how the smokes prove a write was PAID) need the bearer
# token; writes (the open-peerings job's POST /peers, /channels/:id/fund and
# /routes/peers) need an RFC 9421 signature from the allowlisted key.
[operator]
bearer_token_file = "/app/data/operator-bearer.token"
write_keys_file = "/app/data/operator-write.keys"
