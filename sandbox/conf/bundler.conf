# Environment shared by the Turbo bundler stack services (upload-service,
# fulfillment-service, localstack) via env_file. Named *.conf, not *.env,
# because this workspace denies writing *.env files — compose does not care.
# Per-service structural env (ports, DB, SQS URLs) lives in
# docker-compose.yml; this file holds identity + shared values.
# Source of truth for the choices: prototypes/gateway-upload/VERDICT.md on
# branch prototype/local-ar-io-stack.

NODE_ENV=local
APP_NAME=toon-sandbox-bundler

