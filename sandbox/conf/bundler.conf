# Allow all uploaders (upload-service defaults to false -> nobody may
# upload). Swap for ALLOW_LISTED_ADDRESSES if gating is ever wanted.
SKIP_BALANCE_CHECKS=true

# Must equal the gateway's ADMIN_API_KEY (optical-bridge auth: fulfillment
# POSTs to /ar-io/admin/queue-data-item).
ADMIN_API_KEY=toon-sandbox-admin-key
AR_IO_ADMIN_KEY=toon-sandbox-admin-key

# Localstack S3 bucket shared between gateway and bundler.
AWS_REGION=us-east-1
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
AWS_ENDPOINT=http://localstack:4566
DATA_ITEM_BUCKET=ar.io
DATA_ITEM_BUCKET_REGION=us-east-1
DATA_ITEM_S3_PREFIX=data
BUNDLE_PAYLOAD_S3_PREFIX=data
S3_FORCE_PATH_STYLE=true
