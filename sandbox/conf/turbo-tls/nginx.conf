# The turbo-tls shim: terminates HTTPS for upload.ardrive.io (and the other
# ardrive hostnames) INSIDE the compose network and proxies to the LOCAL Turbo
# upload service. The store's turbo-sdk has no upload-URL override (documented
# gap, see README), so the sandbox redirects the production hostname instead:
# the `turbo-tls` service carries network aliases for these hostnames, and the
# store trusts the committed throwaway CA via NODE_EXTRA_CA_CERTS.
#
# Every certificate/key here is a valueless committed throwaway ONLY trusted
# by the sandbox's own store container.
events {}
http {
  server {
    listen 443 ssl;
    server_name upload.ardrive.io turbo.ardrive.io;
    ssl_certificate /etc/turbo-tls/cert.pem;
    ssl_certificate_key /etc/turbo-tls/key.pem;
    client_max_body_size 20m;
    location / {
      proxy_pass http://upload-service:5100;
      proxy_set_header Host $host;
    }
  }
  # payment.ardrive.io has no local counterpart (the sandbox bundler runs with
  # SKIP_BALANCE_CHECKS=true and the store's paid Turbo top-ups are off), so
  # anything that reaches it answers 503 loudly rather than hanging on DNS.
  server {
    listen 443 ssl;
    server_name payment.ardrive.io;
    ssl_certificate /etc/turbo-tls/cert.pem;
    ssl_certificate_key /etc/turbo-tls/key.pem;
    location / { return 503 '{"error":"no local turbo payment service in the sandbox"}'; }
  }
}
