# =============================================================================
# provider-connector — terminates g.toon.provider.* in front of the compute
# provider app (toon-provider, the `provider` compose service) and is the
# PAYEE of the relay-provider peering.
# =============================================================================
# Copied from conf/connector-store.toml — README §5 Level 2. See
# conf/connector-relay.toml for the shared provenance notes.

client_edge_addr = "0.0.0.0:3000"
state_dir = "/app/state"

# Peer carriages ride this node's own listener, told apart from clients by
# authentication rather than by port. "http" because the hub dials http://.
peer_expose = "http"

# The hub is a plain http:// container port too, and this node reads its
# self-description and dials it to open its own reverse channel.
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What this node publishes at GET /ilp, and so what the hub DIALS: its
# compose-network name, because the hub's `POST /peers` reads this document and
# dials the endpoint in it. A host-run client reaches the same node at
# 127.0.0.1:3240 (scripts/lib/sandbox-endpoints.mjs). No `btp_endpoint`:
# `POST /peers` prefers BTP wherever a node publishes it, and this peering
# rides HTTP.
[node]
addresses = ["g.toon.provider"]
http_endpoint = "http://provider-connector:3000/ilp"

# ── The terminated routes ────────────────────────────────────────────────────
# GENERATED by the provider itself — `toon-provider routes --config
# conf/provider.toml` (run it in the `provider` container, or from the sibling
# checkout) — and pasted verbatim: one spawn and one extend row per listing
# version at the LISTING PRICE in uUSDC per Lease Interval (TOON_Network ADR
# 0003: one route, one price, no refunds — a refusal on a paid route is still
# billed), plus the four free provider-wide rows. Every path is literal and
# the app serves exactly these. A listing change is a new version with new
# rows here and a restart (ADR 0009); re-run the command rather than editing.
#
# This node both terminates AND prices each route: a peer PREPARE must arrive
# covered to the figure or it is refused F06 — the hub's forwarding rows in
# scripts/peerings.mjs (price + 100 fee) are what cover it.
[[routes]]
prefix = "g.toon.provider.basic.v1.spawn"
handler_url = "http://provider:8080/listings/basic/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider.basic.v1.extend"
handler_url = "http://provider:8080/listings/basic/v1/extend"
price = 1000

[[routes]]
prefix = "g.toon.provider.smoke.v1.spawn"
handler_url = "http://provider:8080/listings/smoke/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider.smoke.v1.extend"
handler_url = "http://provider:8080/listings/smoke/v1/extend"
price = 1000

# The `ci` listing (conf/provider.toml; spec Appendix A.1): 5000 per 600 s
# Lease Interval, bought by `make smoke-ci`.
[[routes]]
prefix = "g.toon.provider.ci.v1.spawn"
handler_url = "http://provider:8080/listings/ci/v1/spawn"
price = 5000

[[routes]]
prefix = "g.toon.provider.ci.v1.extend"
handler_url = "http://provider:8080/listings/ci/v1/extend"
price = 5000

# The `warm` listing (conf/provider.toml): the tier that prices Warm Standbys,
# so `toon-provider routes` prints FOUR rows for it — the running pair at 1000
# and the standby pair at its `standby_price`, 400. Bought by `make smoke-m3`.
[[routes]]
prefix = "g.toon.provider.warm.v1.spawn"
handler_url = "http://provider:8080/listings/warm/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider.warm.v1.extend"
handler_url = "http://provider:8080/listings/warm/v1/extend"
price = 1000

[[routes]]
prefix = "g.toon.provider.warm.v1.standby"
handler_url = "http://provider:8080/listings/warm/v1/standby"
price = 400

[[routes]]
prefix = "g.toon.provider.warm.v1.standby.extend"
handler_url = "http://provider:8080/listings/warm/v1/standby/extend"
price = 400

[[routes]]
prefix = "g.toon.provider.availability"
handler_url = "http://provider:8080/availability"
price = 0

[[routes]]
prefix = "g.toon.provider.status"
handler_url = "http://provider:8080/status"
price = 0

[[routes]]
prefix = "g.toon.provider.terminate"
handler_url = "http://provider:8080/terminate"
price = 0

[[routes]]
prefix = "g.toon.provider.rotate"
handler_url = "http://provider:8080/rotate"
price = 0
# ── The peering with the hub: not in this file ───────────────────────────────
# ADR 0075: a peering is two one-way x402 channels, each opened by its own node
# with a fresh salt, so no config can name one. The `open-peerings` init job
# (scripts/open-peerings.mjs, table in scripts/peerings.mjs) sends this node a
# signed `POST /peers` naming the hub FIRST — binding the hub's voucher signer,
# so every forwarded packet arrives in the PEER role, and opening this node's
# own small channel back toward the hub through the hub's sponsor endpoint —
# and then the hub its own, which opens the channel that pays this node.

# ── Settlement ───────────────────────────────────────────────────────────────
# The hub's terms exactly (conf/connector-relay.toml says why each value is
# what it is): FiatToken USDC on anvil, named "USDC"/"2", deposited through the
# sandbox's Onboarder; the mock USDC mint on the validator, sponsored from
# 1 USDC. Every channel is an x402 channel (connector ADR 0075).
[settlement.evm]
rpc_url = "http://anvil:8545"
token_address = "0x0A867CA0442383c2A89951244B955AA19b615b58"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"
asset_transfer_method = "eip3009"
facilitator_url = "http://onboarder:4022"

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.solana]
rpc_url = "http://solana-validator:8899"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6
min_sponsored_deposit = 1000000

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

# Operator surface kept ON so scripts/smoke-provider.mjs can read THIS node's
# /claims and prove the peering crossing was actually paid, from the payee's
# own book.
[operator]
bearer_token_file = "/app/data/operator-bearer.token"
write_keys_file = "/app/data/operator-write.keys"
