# =============================================================================
# provider-connector — terminates g.toon.provider.* in front of the compute
# provider app (toon-provider, the `provider` compose service) and ACCEPTS the
# relay-provider peering (it dials nothing; on ILP-over-HTTP the accept-only
# side is structurally the payee).
# =============================================================================
# Copied from conf/connector-store.toml — README §5 Level 2. See
# conf/connector-relay.toml for the shared provenance notes.

client_edge_addr = "0.0.0.0:3000"
state_dir = "/app/state"

# Peer carriages ride this node's own listener, told apart from clients by
# authentication rather than by port. "http" because the hub dials http://.
peer_expose = "http"

[signer]
key_file = "/app/data/signer.key"

[node]
addresses = ["g.toon.provider"]
http_endpoint = "http://127.0.0.1:3240/ilp"
btp_endpoint = "ws://127.0.0.1:3240/ilp/btp"

# ── The terminated routes ────────────────────────────────────────────────────
# GENERATED by the provider itself — `toon-provider routes --config
# conf/provider.toml` (run it in the `provider` container, or from the sibling
# checkout) — and pasted verbatim: one spawn and one extend row per listing
# version at the LISTING PRICE in uUSDC per Lease Interval (TOON_Network ADR
# 0003: one route, one price, no refunds — a refusal on a paid route is still
# billed), plus the three free provider-wide rows. Every path is literal and
# the app serves exactly these. A listing change is a new version with new
# rows here and a restart (ADR 0009); re-run the command rather than editing.
#
# This node both terminates AND prices each route: a peer PREPARE must arrive
# covered to the figure or it is refused F06 — the hub's forwarded rows in
# conf/connector-relay.toml (price + 100 fee) are what cover it.
[[routes]]
prefix = "g.toon.provider.basic.v1.spawn"
handler_url = "http://provider:8080/listings/basic/v1/spawn"
price = 1000

[[routes]]
prefix = "g.toon.provider.basic.v1.extend"
handler_url = "http://provider:8080/listings/basic/v1/extend"
price = 1000

[[routes]]
prefix = "g.toon.provider.availability"
handler_url = "http://provider:8080/availability"
price = 0

[[routes]]
prefix = "g.toon.provider.status"
handler_url = "http://provider:8080/status"
price = 0

[[routes]]
prefix = "g.toon.provider.terminate"
handler_url = "http://provider:8080/terminate"
price = 0
# ── The peering (accepting half) ─────────────────────────────────────────────
# No endpoint: the hub dials us. The id is a purely local label.
[[peers]]
id = "relay-provider"

# Same channel as the hub's row, counterparty pointed the other way: the
# hub's SOLANA settlement public key, whose signature this node accepts on
# claims. The channel is opened post-boot through the HUB's operator surface
# by the open-toon-solana-channels job (the payer side opens and deposits);
# the PDA is find_program_address(["channel", min, max, mint]) over the two
# settlement keys, derived and asserted by scripts/open-solana-channel.py.
[[peer_channels]]
peer_id = "relay-provider"
channel_account = "87EGu9qGRB3G88jTdwz51uJscLQDHgzJfje7eXWfuEkn"
counterparty_key = "9gXKH3AtUErhsAVaLmBkiJxdtUmUE29MjaRLFKxCqfAx" # relay-connector Solana settlement

[settlement.evm]
rpc_url = "http://anvil:8545"
contract_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
token_address = "0x5FbDB2315678afecb367f032d93F642f64180aa3"
decimals = 6

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.solana]
rpc_url = "http://solana-validator:8899"
program_id = "HY4AYFNe5Vg5BkEwAURNsGY3uFAvGMNpAQPRtgoasJiR"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

# Operator surface kept ON so scripts/smoke-provider.mjs can read THIS node's
# /claims and prove the peering crossing was actually paid, from the payee's
# own book.
[operator]
bearer_token_file = "/app/data/operator-bearer.token"
write_keys_file = "/app/data/operator-write.keys"
