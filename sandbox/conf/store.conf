# Env for the `store` service (paid Arweave blob store, kind:5094/5095).
# All values are committed throwaways for the local sandbox.
NODE_NOSTR_SECRET_KEY=c2d8bf8de595c089a5b1c475e0a09456abdfebb504f0d815ec2423757cf32c7d
HANDLER_PORT=3300
BLS_PORT=3400
# Stable Turbo signing identity (base58 of a 64-byte Solana secret; the
# committed keys/toon/store-turbo-signer.json is the same keypair in CLI form).
# STORE_TURBO_MAX_ARIO_PER_UPLOAD is deliberately UNSET: paid Turbo top-ups
# are off, so the store serves the free tier (data items up to 107,520 bytes)
# only — that limit is the STORE's own gate on the keyless path, independent
# of which Turbo it talks to, and it is all the sandbox smoke needs (the local
# bundler skips balance checks anyway).
STORE_TURBO_SOLANA_KEY=67mASTwpCSWyMErcHgEDMs2f6vCt9ag2TJWhica7YP3yEWbwjtj2ickTnQDxpaBNrRSB1JZciQM5SCBJzKC6qTHg
# Uploads go to the LOCAL Turbo upload service, plain http inside the compose
# network — the exact upstream the retired turbo-tls shim used to proxy
# https://upload.ardrive.io to (docker-compose.yml builds the store from the
# sibling checkout that carries this override). STORE_TURBO_PAYMENT_URL stays
# UNSET: the free-tier path never talks to a payment service (the shim served
# payment.ardrive.io a 503 and everything passed).
STORE_TURBO_UPLOAD_URL=http://upload-service:5100
# ── kind:5095 ArNS brokered buy (op=buy) ─────────────────────────────────────
# The DVM's funded payer wallet: 128-char hex (64-byte Ed25519 secretKey ‖
# publicKey); the committed keys/toon/arns-dvm.json is the same keypair in
# Solana CLI form (address BxXJbhp6CbUj4KJEadTwe3q6EfMKwFVczGQctpnHsCB3,
# funded with SOL + 10,000 local ARIO by scripts/seed-solana.mjs).
ARNS_DVM_SOLANA_SECRET_KEY=862e627d5b9bc62e2525679c7a5a68daeb16cf23c070490fd6070b2f0bc68d32a2ce13f46e4bdb87f0fd5578f31948611a5bfb11d7877c0ae347b034d5c25702
# devnet is the store's default; explicit for clarity. Program ids follow this
# (= @ar.io/sdk DEVNET_PROGRAM_IDS = exactly what the local validator loads at
# genesis); only the CONNECTION moves to the local validator.
ARNS_NETWORK=devnet
ARNS_SOLANA_RPC_URL=http://solana-validator:8899
ARNS_SOLANA_WS_URL=ws://solana-validator:8900
# Informational only (surfaced on /health); the connector is what charges.
FEE_PER_JOB=10
LOG_LEVEL=info
