# =============================================================================
# THE EVM ASSET LAYER'S NUMBERS — one file, sourced by three things.
# =============================================================================
# scripts/seed-toon-evm-amm.sh builds the layer from these, scripts/swap-driver.sh
# steers it by them, and scripts/smoke-toon.mjs re-derives the hub's ANYONE
# price from them. Every address below is DETERMINISTIC (a pure function of a
# fixed deployer and a fixed nonce, or of Uniswap's own CREATE2), which is what
# lets the connector TOMLs name them; the seed script asserts each one and
# refuses to report success on a drift.
#
# Shell `KEY=value` (like conf/anytoon.conf) because a POSIX shell sources it.
# The connector configs restate these values by hand — the connector has NO
# environment layer — which is exactly why the smoke test re-derives them.

# ── Tokens ───────────────────────────────────────────────────────────────────
# ANYONE and WETH9 are the MAINNET contracts at their MAINNET addresses (the
# seed script places their real runtime bytecode with anvil_setCode); USDC is
# the connector's own DeployLocal mock, 6 decimals, and stays the numeraire.
ANYONE_TOKEN=0xFeAc2Eae96899709a43E252B6B92971D32F9C0F9
WETH_TOKEN=0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2
USDC_TOKEN=0x5FbDB2315678afecb367f032d93F642f64180aa3

# TokenNetworkRegistry nonce 2 (nonce 1 was DeployLocal's USDC TokenNetwork at
# 0xCafac3dD...). This is what `[settlement.evm]` resolves for ANYONE, and a
# connector that cannot resolve one refuses to start.
ANYONE_TOKEN_NETWORK=0x9f1ac54BEF0DD2f6f3462EA0fa94fC62300d3a8e

# ── Uniswap v3 ───────────────────────────────────────────────────────────────
# anvil account 8, nonces 0 and 1.
UNISWAP_V3_FACTORY=0x95bD8D42f30351685e96C62EDdc0d0613bf9a87A
SANDBOX_AMM=0x98eDDadCfde04dC22a0e62119617e74a6Bc77313

# Uniswap's own CREATE2 from that factory: salt keccak(token0, token1, fee),
# init-code hash 0xe34f199b...8b54 (the canonical v3 POOL_INIT_CODE_HASH, which
# is itself a check that the committed factory bytecode is the real one).
# Token ORDER is by address: 0xC02a... < 0xFeAc... so WETH is token0 of the
# ANYONE pool (as on mainnet), and 0x5FbD... < 0xC02a... so USDC is token0 of
# the other.
POOL_ANYONE_WETH=0x8983f1366e1c0d20647c9a1b0cb46ce4c46e13c7
POOL_WETH_USDC=0xef5d6240753bcaa3b8e59a9c668c62d430692c58

# ── The price this sandbox deals at ──────────────────────────────────────────
# ANYONE = 0.25 USDC, ETH = 3000 USDC, so 1 WETH = 12000 ANYONE. Both legs are
# `token1 per token0 in BASE UNITS`, which is the only thing a v3 tick means and
# the only thing the connector's rate source reads (ADR 0071 decision 4: the
# decimals gap is already folded into the tick, and nothing applies a second
# scale). Composed, that is 4e12 ANYONE base units per uUSDC — the number every
# ANYONE price in conf/connector-relay.toml is derived from.
#
#   sqrt(12000)           * 2^96 = 8679010359749558978863043572483
#   sqrt(1e18/(3000*1e6)) * 2^96 = 1446501726624926496477173928747178
POOL_ANYONE_WETH_SQRTP=8679010359749558978863043572483
POOL_WETH_USDC_SQRTP=1446501726624926496477173928747178

# One FULL-RANGE position per pool, so the curve is plain constant-product and
# the swap driver's step sizes below are simple arithmetic rather than tick
# math. MIN/MAX_TICK (+/-887272) rounded INWARD to each pool's tick spacing.
FULL_RANGE_LO_200=-887200
FULL_RANGE_HI_200=887200
FULL_RANGE_LO_10=-887270
FULL_RANGE_HI_10=887270
# L chosen so the positions hold ~100 WETH + 1.2M ANYONE and ~1000 WETH + 3M
# USDC: deep enough that the driver's steps move the price by design rather
# than by accident.
POOL_ANYONE_WETH_LIQUIDITY=10954451150103322269139
POOL_WETH_USDC_LIQUIDITY=54772255750516611

# What the SandboxAmm contract holds, so it can pay its own mint/swap callbacks
# and still have a float to trade with for as long as the sandbox is up.
WETH_FLOAT=2000000000000000000000
ANYONE_FLOAT=2000000000000000000000000
USDC_FLOAT=5000000000000

# ── The oracle ───────────────────────────────────────────────────────────────
# The window both connector quote legs ask for. 300s against a driver that
# trades every 15s is 20 observations per window — smooth enough that the TWAP
# tracks the driver's intent rather than its last trade.
TWAP_WINDOW_SECS=300
# The ring has to stay longer than the window at the driver's cadence:
# 128 observations x 15s = 1920s, six windows of slack.
OBSERVATION_CARDINALITY=128
# Priming: 10 steps of 90s = 900s of history, written before any connector
# starts. This is ALSO exactly how far behind wall-clock the anvil service is
# started (`--timestamp`), so the chain leaves priming at real time.
PRIME_STEPS=10
PRIME_STEP_SECS=90
PRIME_SPAN_SECS=900
PRIME_DUST_WETH=10000000000000000
PRIME_DUST_ANYONE=120000000000000000000
PRIME_DUST_USDC=30000000

# ── The swap driver ──────────────────────────────────────────────────────────
# A TRIANGLE WAVE, not a random walk: the driver steers the ANYONE/WETH pool's
# tick towards `target + band` for half a period and `target - band` for the
# other half, so the TWAP is genuinely live and genuinely BOUNDED. The bound is
# what lets the hub quote a STATIC uUSDC price for a FLOATING rate at all (see
# conf/connector-relay.toml) — a random walk would eventually wander out of the
# headroom that price was sized for and start refusing purchases.
#
# tick 93931 is ln(12000)/ln(1.0001); 200 ticks is 1.0001^200 - 1 = 2.02%.
SWAP_INTERVAL_SECS=15
ANYONE_TARGET_TICK=93931
ANYONE_BAND_TICKS=200
ANYONE_HALF_PERIOD_SECS=300
# ~0.2% of the ANYONE/WETH pool's price per step (20 ticks): 0.1 WETH against a
# 100-WETH side.
STEP_WETH=100000000000000000
STEP_ANYONE=1200000000000000000000
# The WETH/USDC leg is the STABLE one: the driver always steers it straight back
# to its target tick, so it contributes observations (and blocks, which is what
# keeps every rate's `last_refreshed` moving) without contributing drift.
WETH_USDC_TARGET_TICK=196256
STEP_USDC=30000000
STEP_WETH_SMALL=10000000000000000
