# Environment for the AR.IO core service (env_file input; named *.conf, not
# *.env, because this workspace denies writing *.env files — compose does not
# care about the extension).
#
# Two groups below: (1) values replicated from ar-io-node r83's own compose
# defaults (the vendored service definition no longer interpolates them), and
# (2) the sandbox's proven deltas, annotated with WHY. Sources:
# prototypes/gateway-upload/VERDICT.md and prototypes/full-stack/VERDICT.md on
# branch prototype/local-ar-io-stack.

# ── (1) replicated upstream compose defaults ────────────────────────────────
NODE_ENV=production
LOG_LEVEL=info
LOG_FORMAT=simple
CHAIN_CACHE_TYPE=redis
REDIS_CACHE_URL=redis://redis:6379
CHUNK_METADATA_CACHE_TYPE=redis
ARNS_CACHE_TYPE=redis
ARNS_CACHE_MAX_KEYS=10000
AR_IO_NODE_RELEASE=83
AR_IO_SDK_LOG_LEVEL=none

# ── (2) sandbox configuration ───────────────────────────────────────────────

# Must match the bundler's AR_IO_ADMIN_KEY (optical-bridge auth).
ADMIN_API_KEY=toon-sandbox-admin-key

# Cut mainnet: the "trusted Arweave node" is local ArLocal (default would be
# http://envoy:3000 -> arweave.net). ArLocal satisfies tx-anchor lookups and
# /info proxying — but the sync pipeline must never see it (START_WRITERS).
TRUSTED_NODE_URL=http://arlocal:1984
ARWEAVE_PEER_DNS_RECORDS=arlocal
ARWEAVE_PEER_DNS_PORT=1984

# Never broadcast tx/chunks to Arweave: POST /tx and /chunk validate and
# return 200 locally ("Dry-run mode ... skipping POST").
ARWEAVE_POST_DRY_RUN=true

# CRITICAL: core's block importer crashes on ArLocal's minimal genesis block
# (fromB64Url(undefined) uncaught-exception loop). START_WRITERS=false
# disables only blockImporter + tx/bundle repair + mempool watcher; the
# optical queue-data-item path stays fully functional.
START_WRITERS=false

# No observer wallet; the observer service is not part of the sandbox.
RUN_OBSERVER=false

# Bundler integration (values prescribed by ar-io-node's
# .env.bundler.example; the owner_address is keys/bundler-wallet.json).
ANS104_INDEX_FILTER={"always":true}
ANS104_UNBUNDLE_FILTER={"attributes":{"owner_address":"_AfaQWjzW9cnVIDMtb-ufTxSrgWLsvdWe0zxFm_AldE"}}

# Shared localstack S3 bucket: the gateway serves the bytes the upload
# service stored (optical path).
AWS_ENDPOINT=http://localstack:4566
AWS_REGION=us-east-1
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
AWS_S3_CONTIGUOUS_DATA_BUCKET=ar.io
AWS_S3_CONTIGUOUS_DATA_PREFIX=data

# Default retrieval order starts with trusted-gateways (arweave.net) — serve
# from the shared S3 bucket instead.
ON_DEMAND_RETRIEVAL_ORDER=s3

# ── ArNS resolution against the LOCAL validator ─────────────────────────────

# Core reads the ArNS registry + ANT state from the local validator instead
# of Solana mainnet-beta. Plain HTTP JSON-RPC only — the gateway never needs
# the :8900 websocket.
SOLANA_RPC_URL=http://solana-validator:8899

# Program ids actually loaded at validator genesis (= @ar.io/sdk
# DEVNET_PROGRAM_IDS = ar-io-solana-contracts program-ids/staging.json).
# The upstream compose defaults are the MAINNET ids, so all four must be set.
ARIO_CORE_PROGRAM_ID=8Njx9wPkXiNzDCgjwVsJFRjpAEV34gGW3n8DzX3V23m1
ARIO_GAR_PROGRAM_ID=7WsDTrtZBsfKtnP33XkjuqXCY69JE7n4QVYpynqJCFxz
ARIO_ARNS_PROGRAM_ID=6EZNezcg4rc5hnh8HG34vGquT3WpW5xXypzPb24uyEpp
ARIO_ANT_PROGRAM_ID=DbHbRwUD1oAn1mrDSqtWtvwGcNrmhWdD2g8L4xmeQ7NX

# Enables the ArNS subdomain middleware (and envoy's vhost). *.localhost
# resolves to loopback on modern resolvers, so
# http://<name>.ar.localhost:3000/ just works in a browser.
# NOTE: with this set, GET /<43-char-id> 302s to an unreachable sandbox
# subdomain URL — use /raw/<id> for by-id fetches.
ARNS_ROOT_HOST=ar.localhost

# On-demand (chain) resolution only — the default appends a trusted-gateway
# fallback that would call https://__NAME__.turbo-gateway.com on every miss.
ARNS_RESOLVER_PRIORITY_ORDER=on-demand

# Local-dev cache knobs (do NOT ship these to anything pointed at mainnet):
# the base-name list re-hydrates on a cache miss at most this often, so a
# name bought after gateway boot resolves within ~seconds instead of the
# default 120s. The local registry is tiny, so a full re-scan per miss is
# free.
ARNS_NAME_LIST_CACHE_MISS_REFRESH_INTERVAL_SECONDS=5
ARNS_NAME_LIST_CACHE_HIT_REFRESH_INTERVAL_SECONDS=30
# Keep resolution cache short so ANT record edits show up quickly.
ARNS_CACHE_TTL_SECONDS=30
