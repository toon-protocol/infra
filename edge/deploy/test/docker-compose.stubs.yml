# Two stub nodes, joined to `edge` exactly the way a node's shared-edge
# overlay joins it: a SEPARATE compose project, the network declared external,
# the contract's aliases. ./smoke.sh brings this up after the edge.
#
#   store-proxy   plain HTTP on :4000, echoes what it was sent
#   gateway-gw    TLS on :8443 with a self-signed certificate made the way
#                 gateway/deploy/bootstrap.sh makes its own; answers one
#                 granted label and 503 `no_grant` for every other name
name: edge-smoke-stubs

services:
  store:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    volumes:
      - ./stub/store.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      edge:
        aliases: [store-proxy]

  gateway:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    volumes:
      - ./stub/gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STUB_TLS_DIR:?smoke.sh sets STUB_TLS_DIR}:/tls:ro
    networks:
      edge:
        aliases: [gateway-gw]

networks:
  edge:
    external: true
    name: edge
